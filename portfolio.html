<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portfolio — Dual Half Wheel (Responsive)</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0a0a0d; --text:#e9e9ef; --muted:#b9b9c4; --accent:#9ee7ff; --border:rgba(255,255,255,.12);

    /* fonts */
    --font-display: "Bebas Neue", sans-serif;
    --font-sans: "Montserrat", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;

    /* ===== geometria ruota ===== */
    --radius: 480px;

    /* Spicchi larghi e un filo meno alti */
    --spread: 140;
    --wedge-thickness: 260px;

    /* crescita verso l’esterno (hover/attivo) — usata DI NUOVO */
    --wedge-grow-active: 84px;
    --wedge-grow-hover:  56px;

    /* immagini nelle thumb */
    --img-pad: -130px;
    --img-zoom-base: 1.7;
    --img-zoom-lit:  -190px;

    --flyMs: 520ms;
    --fadeMs: 340ms;

    --innerOffset: 84px;
    --innerR: calc(var(--radius) - var(--innerOffset));
  }

  html,body{height:100%}
  body{
    margin:0; overflow:hidden; color:var(--text);
    background: radial-gradient(1200px 600px at 20% 40%, rgba(158,231,255,.08), transparent 70%),
                linear-gradient(180deg,#0b0c10 0%,#07070a 100%);
    font-family: var(--font-sans);
    font-weight: 400;
  }

  /* ===== WRAPPER ===== */
  .viewport{ position:relative; width:100vw; height:100vh; overflow:hidden; }

  /* layout DESKTOP (orizzontale) di default */
  .portfolio-wrapper{
    position:absolute; inset:0;
    width:200vw; height:100%;
    display:flex; flex-direction:row;
    transition: transform .6s cubic-bezier(.22,.8,.24,1);
    will-change: transform;
  }
  .portfolio-wrapper.to-right{ transform: translateX(-100vw); }

  .half{ position:relative; width:100vw; height:100vh; overflow:hidden; }

  /* ===== BACKGROUND / SCRIM ===== */
  .preview-img{ position:absolute; inset:0; z-index:0; background:#000 center/cover no-repeat; transition: opacity var(--fadeMs) ease; }
  .preview-img.hidden{ opacity:0; }

  /* orizzontale: shading verso i bordi destra/sinistra (sopra al fly) */
  .scrim{
    position:absolute; inset:0; z-index:3; pointer-events:none;
    background:
      radial-gradient(60% 60% at 15% 50%, rgba(0,0,0,.08), transparent 70%),
      linear-gradient(to right, rgba(7,7,10,0) 0%, rgba(0,0,0,0.35) 70%, rgba(0,0,0,0.75) 100%),
      linear-gradient(90deg, rgba(7,7,10,.55) 0%, rgba(7,7,10,.22) 35%, rgba(7,7,10,0) 60%);
  }

  /* ===== INFO ===== */
  .preview-info{ position:absolute; left:44px; bottom:44px; z-index:4; max-width:min(70ch, 60vw);
    text-shadow: 0 4px 18px rgba(0,0,0,.75), 0 0 8px rgba(0,0,0,.5);
    transition: opacity var(--fadeMs) ease, transform var(--fadeMs) ease;
  }
  .preview-info.hidden{ opacity:0; transform:translateY(8px); pointer-events:none; }
  .kicker{ font-size:.85rem; letter-spacing:.18em; color:var(--accent); text-transform:uppercase; }
  .title{
    font-family: var(--font-display);
    font-weight:400;
    letter-spacing:.02em;
    font-size: clamp(28px, 4.6vw, 64px);
    line-height:1.02; margin:6px 0 0;
  }
  .subtitle{ margin:6px 0 0; font-size: clamp(14px, 1.4vw, 18px); color:var(--muted); }
  .cta{
    margin-top:14px; display:inline-flex; align-items:center; gap:10px;
    font-family: var(--font-sans); font-weight:600; text-decoration:none;
    color:#0b0c10; background:var(--accent); padding:10px 14px; border-radius:999px;
    transition: box-shadow .22s ease, transform .15s ease, filter .22s ease;
  }
  .cta:hover,.cta:focus-visible{ box-shadow: 0 0 24px rgba(158,231,255,.35), inset 0 0 10px rgba(255,255,255,.35); transform: translateY(-1px); filter: brightness(1.03); }
  .half-right .preview-info{ left:auto; right:44px; text-align:right; }

  /* ===== RUOTA + SPICCHI ===== */
  .wheel-wrap{ position:absolute; top:50%; z-index:20; width: calc(var(--radius)*2); height: calc(var(--radius)*2); transform: translateY(-50%); pointer-events:none; overflow:visible; }
  .wheel{ position:absolute; top:50%; width: calc(var(--radius)*2); height: calc(var(--radius)*2); transform: translateY(-50%); overflow:visible; }

  .item{ position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:22; }
  .item.hovered{ z-index:27; }
  .item.selected{ z-index:28; }

  .wedge-svg{ width:100%; height:100%; display:block; overflow:visible; }

  .wimg{ filter: grayscale(1) brightness(.74) contrast(.92) saturate(.7); transition: filter .22s ease, opacity .22s ease; }

  .wedge-glow{
    fill:none; stroke: rgba(158,231,255,.18); stroke-width: 6;
    vector-effect: non-scaling-stroke; filter: url(#wedgeGlowGeneric); pointer-events:none;
  }
  .wedge-outline{
    fill:none; stroke: rgba(158,231,255,.15); stroke-width: 1.0; stroke-linejoin:round;
    vector-effect: non-scaling-stroke; pointer-events:none; transition: stroke-width .2s ease, stroke .2s ease;
  }

  .label{
    position:absolute; transform: translate(-50%,-50%);
    background:rgba(16,18,24,.86); border:1px solid var(--border);
    padding:4px 8px; border-radius:8px; font-size:16px; white-space:nowrap; color:var(--muted);
    opacity:0; pointer-events:none; transition:opacity .18s ease; backdrop-filter: blur(2px);
    font-family: var(--font-display);
    letter-spacing:.02em;
  }

  .item.lit .label{ opacity:1; }
  .item.lit .wimg{ filter:none; }
  .item.lit .wedge-outline{ stroke-width:2.0; stroke:rgba(158,231,255,.78); }
  .item.lit .wedge-glow{ stroke: rgba(158,231,255,.78); }

  /* ===== FRECCE: AI LATI DELL’IMMAGINE PRINCIPALE ===== */
  .arc-wrap{
    position:absolute; inset:0; z-index:31;
    width:100%; height:100%;
    pointer-events:none; /* solo i bottoni catturano il click */
  }
  .arc-btn{
    position:absolute; z-index:31; pointer-events:auto;
    width:46px; height:46px; border-radius:12px; border:1px solid var(--border);
    background:rgba(18,20,26,.92); color:var(--text); display:grid; place-items:center;
    cursor:pointer; font-size:18px; line-height:1;
    box-shadow:0 8px 28px rgba(0,0,0,.35);
    transition: transform .15s ease, outline-color .15s ease, opacity .2s ease;
    font-family: var(--font-sans);
  }
  .arc-btn:hover{ outline:1px solid rgba(158,231,255,.45); transform: translateY(-1px); }
  .arc-btn[disabled]{ opacity:.35; pointer-events:none; }

  /* ORIZZONTALE: una SOPRA e una SOTTO (centro orizzontale) */
  .arc-btn.up{ left:50%; top:18px; transform: translate(-50%,0); }
  .arc-btn.down{ left:50%; bottom:18px; transform: translate(-50%,0); }

  .half-left .wheel-wrap{ right:0; }   .half-left .wheel{ right: calc(-1 * var(--radius)); }
  .half-right .wheel-wrap{ left:0; }   .half-right .wheel{ left:  calc(-1 * var(--radius)); }

  /* ===== LINEA GUIDA (desktop) ===== */
  .half-left::before,
  .half-right::before{
    content:""; position:absolute; top:50%; width: calc(var(--innerR)*2); height: calc(var(--innerR)*2);
    transform: translateY(-50%); border:1.2px solid rgba(158,231,255,.18);
    border-radius:50%; box-shadow: 0 0 20px rgba(158,231,255,.10) inset; pointer-events:none;
    z-index:6;
  }
  .half-left::before{
    right: calc(-1 * var(--innerR));
    -webkit-mask: linear-gradient(90deg,#000 0 50%,transparent 50% 100%); mask: linear-gradient(90deg,#000 0 50%,transparent 50% 100%);
  }
  .half-right::before{
    left: calc(-1 * var(--innerR));
    -webkit-mask: linear-gradient(90deg,transparent 0 50%,#000 50% 100%); mask: linear-gradient(90deg,transparent 0 50%,#000 50% 100%);
  }

  .side-rail{ position:absolute; top:50%; transform: translateY(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; z-index:8; pointer-events:none; }
  .half-left .side-rail{ right:24px; } .half-right .side-rail{ left:24px; }
  .rail-text{ writing-mode: vertical-rl; text-orientation: upright; font-size:14px; letter-spacing:.35em; text-transform:uppercase; font-weight:600; color:var(--muted); opacity:.7; text-shadow: 0 0 12px rgba(158,231,255,.25); }
  .rail-line{ width:2px; height:28px; background: rgba(158,231,255,.35); box-shadow: 0 0 10px rgba(158,231,255,.25); }
  .rail-badge{ position:absolute; top:50%; transform:translateY(-50%); writing-mode: vertical-rl; text-orientation: upright; font-size:12px; letter-spacing:.35em; color:var(--muted); opacity:.7; text-shadow: 0 0 12px rgba(158,231,255,.25); pointer-events:none; }
  .half-left  .rail-3d { right:100%; margin-right:8px; } .half-right .rail-2d{ left:100%; margin-left:8px; }

  .switch-btn, .back-btn{
    position:fixed; z-index:40; font-size:14px; font-weight:600; color:var(--text);
    background:rgba(18,20,26,.92); padding:10px 14px; border-radius:999px; border:1px solid var(--border); text-decoration:none; box-shadow:0 8px 22px rgba(0,0,0,.35);
    font-family: var(--font-sans);
  }
  .switch-btn{ bottom:18px; right:18px; }  body.on-right .switch-btn{ left:18px; right:auto; }
  .switch-btn:hover, .back-btn:hover{ background:var(--accent); color:#0b0c10; }
  .back-btn{ top:18px; left:18px; }

  /* ====== SCALE VAR ====== */
  @media (max-width: 1200px){
    :root{ --radius: 420px; --spread: 128; --wedge-thickness: 232px; --wedge-grow-active: 72px; --wedge-grow-hover: 48px; }
  }
  @media (max-width: 900px){
    :root{ --radius: 360px; --spread: 120; --wedge-thickness: 210px; --wedge-grow-active: 62px; --wedge-grow-hover: 44px; }
  }
  @media (max-width: 600px){
    :root{ --radius: 300px; --spread: 118; --wedge-thickness: 180px; --wedge-grow-active: 52px; --wedge-grow-hover: 38px; }
  }
  @media (max-width: 430px){
    :root{ --radius: 260px; --spread: 112; --wedge-thickness: 160px; --wedge-grow-active: 46px; --wedge-grow-hover: 32px; }
  }

  /* =========================================================
     ==============   LAYOUT VERTICALE (mobile)   ============ */
  body.vertical .portfolio-wrapper{
    width:100vw; height:200vh; flex-direction:column; transform: translateY(0);
  }
  body.vertical .portfolio-wrapper.to-bottom{ transform: translateY(-100vh); }

  /* scrim verticale */
  body.vertical .half-left .scrim{
    background:
      radial-gradient(60% 60% at 50% 85%, rgba(0,0,0,.08), transparent 70%),
      linear-gradient(to bottom, rgba(7,7,10,0) 0%, rgba(0,0,0,0.35) 70%, rgba(0,0,0,0.75) 100%),
      linear-gradient(0deg, rgba(7,7,10,.55) 0%, rgba(7,7,10,.22) 35%, rgba(7,7,10,0) 60%);
  }
  body.vertical .half-right .scrim{
    background:
      radial-gradient(60% 60% at 50% 15%, rgba(0,0,0,.08), transparent 70%),
      linear-gradient(to top, rgba(7,7,10,0) 0%, rgba(0,0,0,0.35) 70%, rgba(0,0,0,0.75) 100%),
      linear-gradient(180deg, rgba(7,7,10,.55) 0%, rgba(7,7,10,.22) 35%, rgba(7,7,10,0) 60%);
  }

  /* ruota centrata orizzontalmente, appoggiata ai bordi */
  body.vertical .wheel-wrap{ left:50%; transform:none; width:calc(var(--radius)*2); height:calc(var(--radius)*2); }
  body.vertical .half-left .wheel-wrap{ top:auto; bottom:0; transform: translateX(-50%); }
  body.vertical .half-right .wheel-wrap{ top:0; left:50%; transform: translateX(-50%); }

  body.vertical .wheel{ transform:none; left:50%; }
  body.vertical .half-left .wheel{ top:auto; bottom: calc(-1 * var(--radius)); transform: translateX(-50%); }
  body.vertical .half-right .wheel{ top: calc(-1 * var(--radius)); transform: translateX(-50%); }

  /* LINEA GUIDA — layout verticale (ruotata 90°) */
  body.vertical .half-left::before{
    position: absolute;
    left: 50%; top: 100%;
    width: calc(var(--innerR) * 2); height: calc(var(--innerR) * 2);
    transform: translate(-50%, -50%);
    border: 1.2px solid rgba(158,231,255,.18);
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(158,231,255,.10) inset;
    content: ""; pointer-events: none; z-index: 6;
    -webkit-mask: linear-gradient(180deg, #000 0 50%, transparent 50% 100%);
            mask: linear-gradient(180deg, #000 0 50%, transparent 50% 100%);
  }
  body.vertical .half-right::before{
    position: absolute;
    left: 50%; top: 0%;
    width: calc(var(--innerR) * 2); height: calc(var(--innerR) * 2);
    transform: translate(-50%, -50%);
    border: 1.2px solid rgba(158,231,255,.18);
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(158,231,255,.10) inset;
    content: ""; pointer-events: none; z-index: 6;
    -webkit-mask: linear-gradient(0deg, #000 0 50%, transparent 50% 100%);
            mask: linear-gradient(0deg, #000 0 50%, transparent 50% 100%);
  }

  /* FRECCE in verticale: una a SINISTRA e una a DESTRA (centro verticale) */
  body.vertical .arc-btn.up{ left:18px; top:50%; transform: translate(0,-50%); }
  body.vertical .arc-btn.down{ right:18px; left:auto; top:50%; transform: translate(0,-50%); }

  /* ===== RAIL centrato (orizzontale in layout verticale) ===== */
  body.vertical .side-rail{
    top:auto; left:50%; transform: translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    width: max-content; text-align:center;
    pointer-events:auto; /* ora può contenere il bottone cliccabile */
  }
  body.vertical .half-left .side-rail{ bottom: 16px; }
  body.vertical .half-right .side-rail{ top: 16px; }
  body.vertical .rail-line{ display:none; }
  body.vertical .rail-badge{
    position:static; transform:none; writing-mode: horizontal-tb;
    font-size:12px; letter-spacing:.28em; opacity:.9;
  }
  body.vertical .rail-text{
    writing-mode: horizontal-tb; text-orientation: initial; font-size:12px;
    letter-spacing:.28em; text-transform:uppercase; color:var(--muted); opacity:.9;
    position:relative;
  }
  body.vertical .rail-text::before,
  body.vertical .rail-text::after{ content:"—"; margin:0 .5ch; opacity:.9; }

  /* === POSIZIONE INFO === */
  /* Pagina sopra (3D): a sinistra sotto il Back */
  body.vertical .half-left .preview-info{
    left:20px; right:auto;
    top:68px; bottom:auto;
    text-align:left;
    max-width:min(60ch, 88vw);
  }
  /* Pagina sotto (2D): in basso a sinistra */
  body.vertical .half-right .preview-info{
    left:20px; right:auto;
    top:auto; bottom:20px;
    text-align:left;
    max-width:min(60ch, 88vw);
  }

  /* === Switch Btn IN RAIL (solo verticale) === */
  body.vertical .switch-btn{
    position:relative; left:auto; right:auto; top:auto; bottom:auto;
    margin:8px 0 0;   /* default: sotto “PORTFOLIO” (nella rail sopra) */
    z-index:9;
  }
  body.vertical .switch-btn.above{
    margin:0 0 8px;   /* variante: sopra “2D” (nella rail sotto) */
  }

  /* Mobile margins */
  @media (max-width: 640px){
    .preview-info{ left:20px; right:20px; max-width: unset; }
  }

  /* === Fly (ora dentro .half, tra bg e overlay) === */
  .fly{
    position:absolute; z-index:2;  /* sopra .preview-img (0), sotto scrim/ruota/info (>=3) */
    background:#000 center/cover no-repeat; border-radius:16px;
    box-shadow: 0 16px 34px rgba(0,0,0,.55);
    transition:left var(--flyMs) cubic-bezier(.22,.8,.24,1),
      top var(--flyMs) cubic-bezier(.22,.8,.24,1),
      width var(--flyMs) cubic-bezier(.22,.8,.24,1),
      height var(--flyMs) cubic-bezier(.22,.8,.24,1),
      border-radius var(--flyMs) ease,
      transform var(--flyMs) cubic-bezier(.22,.8,.24,1),
      opacity var(--flyMs) ease;
    pointer-events:none;
  }
</style>
</head>
<body>
  <!-- back + switch -->
  <a href="index.html" class="back-btn">← Back</a>
  <button id="switchBtn" class="switch-btn" type="button">Concepts & Artworks →</button>

  <div class="viewport">
    <div id="wrapper" class="portfolio-wrapper">
      <!-- ========== SOPRA / 3D ========== -->
      <section class="half half-left" id="halfLeft">
        <div id="bgA" class="preview-img"></div>
        <div class="scrim"></div>

        <div id="infoA" class="preview-info hidden">
          <div class="kicker">Selected Project</div>
          <h1 id="titleA" class="title">—</h1>
          <p id="subA" class="subtitle">—</p>
          <a id="linkA" class="cta" href="#" target="_self" rel="noopener">Open project ↗</a>

        <div class="wheel-wrap"><div id="wheelA" class="wheel"></div></div>

        <div class="side-rail">

        <div class="arc-wrap">

      <!-- ========== SOTTO / 2D ========== -->
      <section class="half half-right" id="halfRight">
        <div id="bgB" class="preview-img"></div>

        <div id="infoB" class="preview-info hidden">
          <div class="kicker">Selected Project</div>
          <h1 id="titleB" class="title">—</h1>
          <p id="subB" class="subtitle">—</p>
          <a id="linkB" class="cta" href="#" target="_self" rel="noopener">Open project ↗</a>
        </div>

        <div class="wheel-wrap"><div id="wheelB" class="wheel"></div></div>

        <div class="side-rail">
          <span class="rail-badge rail-2d">2D</span>
          <span class="rail-text">PORTFOLIO</span>
        </div>

        <div class="arc-wrap">
          <button id="upB" class="arc-btn up" aria-label="Next">▲</button>
          <button id="downB" class="arc-btn down" aria-label="Previous">▼</button>
        </div>
      </section>
    </div>
  </div>

<script>
/* ========= DATI PROGETTI ========= */
const PROJECTS_LEFT = [
  { title: "The Golden Fall", subtitle: "Environment & Technical Art — Unreal Engine 5.4",
    cover: "projects/the-golden-fall/images/portfolio/goldenfall-cover.png",
    thumb: "projects/the-golden-fall/images/portfolio/goldenfall-cover.png",
    href: "projects/the-golden-fall/index.html" },
  { title: "Abandoned PBY Catalina", subtitle: "Environment Design — Unreal Engine 5.2",
    cover: "projects/swamp/images/portfolio/swamp-cover.png",
    thumb: "projects/swamp/images/portfolio/swamp-cover.png",
    href: "projects/swamp/index.html" },
  { title: "Milan Subway — Diorama", subtitle: "3D modeling, lighting and compositing",
    cover: "projects/metro/images/portfolio/metro-cover3.png",
    thumb: "projects/metro/images/portfolio/metro-cover3.png",
    href: "projects/metro/index.html" },
  { title: "Sloth Guardian", subtitle: "Creature design — ZBrush",
    cover: "projects/sloth/images/portfolio/sloth-cover.png",
    thumb: "projects/sloth/images/portfolio/sloth-cover.png",
    href: "projects/sloth/index.html" },
  { title: "Climbing Plants & Roots", subtitle: "SpeedTree set for interior/exterior",
    cover: "projects/climbing-roots/assets/cover.jpg",
    thumb: "projects/climbing-roots/assets/thumb.jpg",
    href: "projects/climbing-roots/index.html" }
];

const PROJECTS_RIGHT = [
  { title: "Forest Guardian — Concept", subtitle: "Personal concept • Digital Painting",
    cover: "projects/artworks/forest-guardian/cover.png",
    thumb: "projects/artworks/forest-guardian/thumb.png",
    href: "projects/artworks/forest-guardian/index.html" },
  { title: "Neon Alley", subtitle: "Illustration • Procreate",
    cover: "projects/artworks/neon-alley/cover.png",
    thumb: "projects/artworks/neon-alley/thumb.png",
    href: "projects/artworks/neon-alley/index.html" },
  { title: "Oil Study — Portrait", subtitle: "Traditional painting",
    cover: "projects/artworks/oil-portrait/cover.png",
    thumb: "projects/artworks/oil-portrait/thumb.png",
    href: "projects/artworks/oil-portrait/index.html" },
  { title: "Mythic Ruins", subtitle: "Concept art • Photoshop",
    cover: "projects/artworks/mythic-ruins/cover.png",
    thumb: "projects/artworks/mythic-ruins/thumb.png",
    href: "projects/artworks/mythic-ruins/index.html" }
];

/* ========= UTIL ========= */
const byId = id => document.getElementById(id);
const deg2rad = d => d*Math.PI/180;
const NS = "http://www.w3.org/2000/svg";
const uid = () => 'w'+Math.random().toString(36).slice(2,8);

/* Centro angolare in base al layout */
function centerAngle(side){
  return (window.__isVertical)
    ? (side === 'left' ? 270 : 90)
    : (side === 'left' ? 180 : 0);
}

/* anello solido */
function ringSolid(cx, cy, rOut, rIn, a0deg, a1deg){
  const a0=deg2rad(a0deg), a1=deg2rad(a1deg);
  const large = (Math.abs(a1deg-a0deg)>180)?1:0;
  const x0 = cx + rOut*Math.cos(a0), y0 = cy + rOut*Math.sin(a0);
  const x1 = cx + rOut*Math.cos(a1), y1 = cy + rOut*Math.sin(a1);
  const xi = cx + rIn *Math.cos(a1), yi = cy + rIn *Math.sin(a1);
  const xj = cx + rIn *Math.cos(a0), yj = cy + rIn *Math.sin(a0);
  return `M ${x0} ${y0} A ${rOut} ${rOut} 0 ${large} 1 ${x1} ${y1}
          L ${xi} ${yi} A ${rIn} ${rIn} 0 ${large} 0 ${xj} ${yj} Z`;
}

function preloadAspect(url, cb){ const im = new Image(); im.onload = ()=> cb(im.naturalWidth / im.naturalHeight || 1.777); im.src = url; }
function preloadImage(src){
  return new Promise(resolve=>{ const im = new Image(); im.onload = resolve; im.onerror = resolve; im.decode?im.decode().then(resolve).catch(resolve):null; im.src = src; });
}

/* ====== COMPONENTE RUOTA ====== */
function HalfWheel(opts){
  const { rootEl, wheelEl, infoEls, projects, side } = opts;

  function readVars(){
    const cs = getComputedStyle(document.documentElement);
    return {
      R: parseFloat(cs.getPropertyValue('--radius')),
      TH: parseFloat(cs.getPropertyValue('--wedge-thickness')),
      PAD: parseFloat(cs.getPropertyValue('--img-pad')) || 0,
      ZOOM_BASE: parseFloat(cs.getPropertyValue('--img-zoom-base')) || 1.0,
      ZOOM_LIT:  parseFloat(cs.getPropertyValue('--img-zoom-lit'))  || 1.0,
      SPREAD: parseFloat(cs.getPropertyValue('--spread')),
      G_ACTIVE: parseFloat(cs.getPropertyValue('--wedge-grow-active')) || 0,
      G_HOVER:  parseFloat(cs.getPropertyValue('--wedge-grow-hover'))  || 0,
    };
  }
  let V = readVars();

  const data = projects.map(p=>({...p, _ar: 16/9}));
  data.forEach(p=> preloadAspect(p.thumb, ar=>{ p._ar = ar; renderGeometry(); }));

  const count = data.length;
  const baseAngles = Array.from({length:count}, (_,i)=> 180 - V.SPREAD/2 + (i/(count-1)||0)*V.SPREAD );

  let offset = 0, activeIndex = 0, hoverIndex = -1, animating = false;

  (function ensureGlowFilter(){
    if (document.getElementById('wedgeGlowGeneric')) return;
    const svgRoot = document.createElementNS(NS,'svg'); svgRoot.setAttribute('width','0'); svgRoot.setAttribute('height','0'); svgRoot.style.position='absolute';
    const defs = document.createElementNS(NS,'defs');
    const f = document.createElementNS(NS,'filter'); f.setAttribute('id','wedgeGlowGeneric'); f.setAttribute('x','-50%'); f.setAttribute('y','-50%'); f.setAttribute('width','200%'); f.setAttribute('height','200%');
    const blur = document.createElementNS(NS,'feGaussianBlur'); blur.setAttribute('stdDeviation','6');
    const merge = document.createElementNS(NS,'feMerge'); merge.appendChild(document.createElementNS(NS,'feMergeNode')); merge.appendChild(document.createElementNS(NS,'feMergeNode'));
    f.appendChild(blur); f.appendChild(merge); defs.appendChild(f); svgRoot.appendChild(defs); document.body.appendChild(svgRoot);
  })();

  const items = data.map((p, i)=>{
    const el = document.createElement('div'); el.className = 'item';
    const svg = document.createElementNS(NS,'svg'); svg.setAttribute('class','wedge-svg'); svg.setAttribute('viewBox', `0 0 ${2*V.R} ${2*V.R}`); svg.setAttribute('preserveAspectRatio','none');
    const defs = document.createElementNS(NS,'defs');
    const clipId = uid(); const cp = document.createElementNS(NS,'clipPath'); cp.setAttribute('id', clipId); cp.setAttribute('clipPathUnits','userSpaceOnUse'); const cpPath = document.createElementNS(NS,'path'); cp.appendChild(cpPath); defs.appendChild(cp); svg.appendChild(defs);
    const glow = document.createElementNS(NS,'path'); glow.setAttribute('class','wedge-glow'); glow.setAttribute('filter','url(#wedgeGlowGeneric)'); svg.appendChild(glow);
    const img = document.createElementNS(NS,'image'); img.setAttribute('class','wimg'); img.setAttribute('href', p.thumb || ''); try{ img.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href', p.thumb || ''); }catch(e){} img.setAttribute('preserveAspectRatio','none'); svg.appendChild(img); img.setAttribute('clip-path', `url(#${clipId})`);
    const outline = document.createElementNS(NS,'path'); outline.setAttribute('class','wedge-outline'); svg.appendChild(outline);
    const hit = document.createElementNS(NS,'path'); hit.setAttribute('fill','transparent'); hit.style.pointerEvents='auto'; hit.style.cursor='pointer'; svg.appendChild(hit);
    el.appendChild(svg);
    const label = document.createElement('span'); label.className='label'; el.appendChild(label);
    hit.addEventListener('mouseenter', ()=>{ hoverIndex = i; el.classList.add('hovered','lit'); render(); });
    hit.addEventListener('mouseleave', ()=>{ hoverIndex = -1; el.classList.remove('hovered'); el.classList.toggle('lit', i===activeIndex); render(); });
    hit.addEventListener('click', (ev)=>{ ev.stopPropagation(); if(!animating) goTo(i); });
    wheelEl.appendChild(el);
    return { el, svg, img, cpPath, outline, glow, hit, label, aspect: ()=> data[i]._ar };
  });

  function placeImage(it, mid, a0, a1, rIn, rOut, lit){
    const R = V.R, rMid = (rIn + rOut)/2, theta = deg2rad(mid);
    const cx = R + rMid*Math.cos(theta), cy = R + rMid*Math.sin(theta);
    const arcRad = deg2rad(a1 - a0), availW = Math.max(0, rMid * arcRad - 2*V.PAD), availH = Math.max(0, (rOut - rIn) - 2*V.PAD);
    const ar = it.aspect() || 16/9;
    let w = availW, h = w / ar; if (h > availH){ h = availH; w = h * ar; }
    const z = lit ? V.ZOOM_LIT : V.ZOOM_BASE; w *= z; h *= z;
    if (lit){ const clamp = Math.min(availW / w, availH / h, 1); w *= clamp; h *= clamp; }
    it.img.setAttribute('x', cx - w/2); it.img.setAttribute('y', cy - h/2); it.img.setAttribute('width', w); it.img.setAttribute('height', h);
  }

  function renderGeometry(){
    const R = V.R, rOutBase = R - 6, rInBase  = Math.max(10, rOutBase - V.TH);

    /* ---- LARGHEZZA SPICCHI E DISTANZA COSTANTE ---- */
    const ANGLE_GAP = (count>1) ? (baseAngles[1]-baseAngles[0]) : V.SPREAD;
    const WEDGE_FILL_RATIO = 0.95;
    const HALF_WIDTH = Math.max(4, (ANGLE_GAP * WEDGE_FILL_RATIO) / 2);

    items.forEach((it, i)=>{
      const mid = baseAngles[i] + offset;
      const grow = (i===activeIndex ? V.G_ACTIVE : 0) + (i===hoverIndex ? V.G_HOVER : 0);

      const rOut = rOutBase + Math.max(0, grow);
      const rIn  = rInBase;

      const a0 = mid - HALF_WIDTH;
      const a1 = mid + HALF_WIDTH;

      const dClip = ringSolid(R, R, rOut, rIn, a0, a1);
      it.cpPath.setAttribute('d', dClip); it.outline.setAttribute('d', dClip); it.glow.setAttribute('d', dClip); it.hit.setAttribute('d', dClip);

      const lit = (i===activeIndex) || (i===hoverIndex);
      placeImage(it, mid, a0, a1, rIn, rOut, lit);

      const labelR = (rOut + rIn)/2, ang = deg2rad(mid);
      it.label.style.left = (R + labelR*Math.cos(ang)) + 'px';
      it.label.style.top  = (R + labelR*Math.sin(ang)) + 'px';
      it.label.textContent = `${projects[i].title}`; // ← numeri rimossi

      it.el.classList.toggle('selected', i===activeIndex);
      it.el.classList.toggle('hovered',  i===hoverIndex);
      it.el.classList.toggle('lit', lit);
    });
  }

  function nearestValid(){
    let best = {idx:0, dist:Infinity};
    for(let i=0;i<count;i++){
      const a = baseAngles[i] + offset;
      const d = Math.abs(a - centerAngle(side));
      if(d < best.dist){ best = {idx:i, dist:d}; }
    }
    return best.idx;
  }

  function render(){
    renderGeometry();
    if(animating) return;
    const idx = nearestValid();
    if(activeIndex !== idx){ activeIndex = idx; updateActive(false); }
    else { updateArcButtons(); }
  }

  function updateActive(applyBg=true){
    const p = projects[activeIndex];
    if(applyBg){
      infoEls.bg.classList.add('hidden');
      setTimeout(()=>{ infoEls.bg.style.backgroundImage = `url('${p.cover}')`; infoEls.bg.classList.remove('hidden'); }, 20);
    }
    infoEls.title.textContent = p.title || '';
    infoEls.sub.textContent   = p.subtitle || '';
    infoEls.link.href         = p.href || '#';
    infoEls.link.style.display = p.href ? '' : 'none';
    updateArcButtons();
    renderGeometry();
  }

  function updateArcButtons(){
    const upBtn = rootEl.querySelector('.arc-btn.up');
    const downBtn = rootEl.querySelector('.arc-btn.down');
    const atFirst = activeIndex === 0, atLast  = activeIndex === count - 1;

    if (window.__isVertical){
      // In verticale: up = previous (-1), down = next (+1)
      upBtn.disabled   = atFirst;
      downBtn.disabled = atLast;
    } else {
      // In orizzontale: up = next (+1), down = previous (-1)
      upBtn.disabled   = atLast;
      downBtn.disabled = atFirst;
    }

    const show = count > 1;
    downBtn.style.display = show ? '' : 'none';
    upBtn.style.display   = show ? '' : 'none';
  }

  function getFlyDir(){
    return window.__isVertical ? (side==='left' ? 'up' : 'down') : (side==='left' ? 'right' : 'left');
  }

  /* Fly ora dentro la metà corrente (rootEl), tra bg (z0) e overlay (z>=3) */
  function flyScreen(dir, img){
    return new Promise(resolve=>{
      const fly = document.createElement('div');
      fly.className = 'fly';
      fly.style.backgroundImage = `url('${img}')`;

      const w = rootEl.clientWidth;
      const h = rootEl.clientHeight;

      let x0=0, y0=0;
      if(dir==='left'){ x0 = -w; } 
      if(dir==='right'){ x0 = w;  }
      if(dir==='up'){ y0 = h;  } 
      if(dir==='down'){ y0 = -h; }

      Object.assign(fly.style,{
        left: x0+'px', top: y0+'px', width: w+'px', height: h+'px', borderRadius:'0px', opacity:'1'
      });

      rootEl.appendChild(fly);
      void fly.getBoundingClientRect();

      fly.style.left = '0px';
      fly.style.top  = '0px';
      fly.style.transform = 'translate(0,0)';

      const finish = ()=>{ fly.remove(); resolve(); };
      fly.addEventListener('transitionend', finish, {once:true});
      setTimeout(finish, (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--flyMs'))||520)+120);
    });
  }

  async function goTo(target){
    if (animating || target === activeIndex) return;
    animating = true; document.body.classList.add('nohover');

    /* 1) Nascondo subito titolo/sottotitolo/CTA */
    infoEls.infoBox.classList.add('hidden');

    /* 2) Muovo la ruota e aggiorno solo i controlli (NON i testi) */
    const delta = (baseAngles[target] + offset) - centerAngle(side);
    offset -= delta; activeIndex = target;
    updateArcButtons();   // mantieni corretto fine-corsa durante l'animazione
    render();             // ridisegna gli spicchi

    /* 3) Eseguo la transizione full-screen e pre-carico l'immagine */
    const to = projects[target];
    await Promise.all([ flyScreen(getFlyDir(), to.cover), preloadImage(to.cover) ]);

    /* 4) Aggiorno lo sfondo e SOLO ORA i testi/CTA, poi li mostro */
    infoEls.bg.style.backgroundImage = `url('${to.cover}')`;
    updateActive(false);
    infoEls.infoBox.classList.remove('hidden');

    animating = false; document.body.classList.remove('nohover');
  }

  function nextIndex(from, dir){ let i = from + dir; if(i<0) i=0; if(i>count-1) i=count-1; return i; }
  const step = (dir=1)=> goTo(nextIndex(activeIndex, dir));

  // frecce (in verticale invertiamo il senso visivo → ◀/▶)
  rootEl.querySelector('.arc-btn.up').addEventListener('click', ()=> step(window.__isVertical ? -1 : +1));
  rootEl.querySelector('.arc-btn.down').addEventListener('click', ()=> step(window.__isVertical ? +1 : -1));

  // scroll interno
  let wheelCooldown=false;
  function handleWheel(dir){ if (wheelCooldown || animating) return; wheelCooldown=true; document.body.classList.add('nohover'); step(dir); setTimeout(()=>{wheelCooldown=false; document.body.classList.remove('nohover');},260); }
  function attachWheel(el){
    if(!el) return;
    el.addEventListener('wheel', (e)=>{
      if (Math.abs(e.deltaY) < 10 || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      e.preventDefault(); e.stopPropagation();
      handleWheel(e.deltaY > 0 ? -1 : +1);
    }, {passive:false});
  }
  attachWheel(wheelEl); attachWheel(wheelEl.parentElement); attachWheel(rootEl);

  function start(){
    const mid = Math.floor((count - 1) / 2);
    offset = centerAngle(side) - baseAngles[mid];
    render(); activeIndex = nearestValid(); updateActive(true);
    infoEls.infoBox.classList.remove('hidden');
  }

  window.addEventListener('resize', ()=>{
    V = readVars();
    items.forEach(it=> it.svg.setAttribute('viewBox', `0 0 ${2*V.R} ${2*V.R}`));
    const current = baseAngles[activeIndex] + offset, target = centerAngle(side);
    offset -= (current - target);
    render();
  });

  start();
  return { step, goTo, render };
}

/* ========= ISTANZE ========= */
const halfA = new HalfWheel({ rootEl: byId('halfLeft'),  wheelEl: byId('wheelA'),
  infoEls: { bg: byId('bgA'), title: byId('titleA'), sub: byId('subA'), link: byId('linkA'), infoBox: byId('infoA') },
  projects: PROJECTS_LEFT, side: 'left' });

const halfB = new HalfWheel({ rootEl: byId('halfRight'), wheelEl: byId('wheelB'),
  infoEls: { bg: byId('bgB'), title: byId('titleB'), sub: byId('subB'), link: byId('linkB'), infoBox: byId('infoB') },
  projects: PROJECTS_RIGHT, side: 'right' });

/* ========= SWITCH / LAYOUT ========= */
const wrapper = byId('wrapper');
const switchBtn = byId('switchBtn');
let onRight = false; // in verticale significa "in basso"

function isVerticalLayout(){
  return (innerHeight > innerWidth) || matchMedia('(max-aspect-ratio: 1/1)').matches;
}

function placeSwitchButton(){
  if(!window.__isVertical){
    // in orizzontale torna fisso nel body
    switchBtn.classList.remove('above');
    document.body.appendChild(switchBtn);
    return;
  }
  const railTop = document.querySelector('#halfLeft .side-rail');
  const railBottom = document.querySelector('#halfRight .side-rail');
  const badge2d = railBottom ? railBottom.querySelector('.rail-2d') : null;

  if(onRight){
    // pagina sotto (2D): bottone sopra "2D"
    switchBtn.classList.add('above');
    if(railBottom && badge2d){ railBottom.insertBefore(switchBtn, badge2d); }
  }else{
    // pagina sopra (3D): bottone sotto “PORTFOLIO”
    switchBtn.classList.remove('above');
    if(railTop){ railTop.appendChild(switchBtn); }
  }
}

function setArrowGlyphs(){
  const upBtns = document.querySelectorAll('.arc-btn.up');
  const dnBtns = document.querySelectorAll('.arc-btn.down');
  if (window.__isVertical){
    upBtns.forEach(b=>{ b.textContent='◀'; b.setAttribute('aria-label','Previous'); });
    dnBtns.forEach(b=>{ b.textContent='▶'; b.setAttribute('aria-label','Next'); });
  } else {
    upBtns.forEach(b=>{ b.textContent='▲'; b.setAttribute('aria-label','Next'); });
    dnBtns.forEach(b=>{ b.textContent='▼'; b.setAttribute('aria-label','Previous'); });
  }
}
function applyLayout(){
  window.__isVertical = isVerticalLayout();
  document.body.classList.toggle('vertical', window.__isVertical);
  if(window.__isVertical){
    wrapper.classList.toggle('to-right', false);
    wrapper.classList.toggle('to-bottom', onRight);
  }else{
    wrapper.classList.toggle('to-bottom', false);
    wrapper.classList.toggle('to-right', onRight);
  }
  setArrowGlyphs();
  updateSwitchLabel();

  /* Forza aggiornamento stato frecce per nuovo layout */
  halfA.render();
  halfB.render();
}
function updateSwitchLabel(){
  if(window.__isVertical){
    switchBtn.textContent = onRight ? 'Back to 3D Portfolio ↑' : 'Concepts & Artworks ↓';
    document.body.classList.toggle('on-right', onRight);
  }else{
    switchBtn.textContent = onRight ? 'Back to 3D Portfolio ←' : 'Concepts & Artworks →';
    document.body.classList.toggle('on-right', onRight);
  }
  placeSwitchButton();
}
function goNext(){
  onRight = true;
  if(window.__isVertical){ wrapper.classList.add('to-bottom'); }
  else { wrapper.classList.add('to-right'); }
  updateSwitchLabel();
}
function goPrev(){
  onRight = false;
  if(window.__isVertical){ wrapper.classList.remove('to-bottom'); }
  else { wrapper.classList.remove('to-right'); }
  updateSwitchLabel();
}
switchBtn.addEventListener('click', ()=> (onRight ? goPrev() : goNext()));

applyLayout();
window.addEventListener('resize', applyLayout);

/* ========= SWIPE ========= */
let tX=null,tY=null; const SWIPE_THRESH = 60;
function currentHalf(){ return onRight ? halfB : halfA; }

document.addEventListener('touchstart', (e)=>{ const t = e.touches[0]; tX = t.clientX; tY = t.clientY; }, {passive:true});
document.addEventListener('touchmove', (e)=>{
  if(tX===null) return;
  const t = e.touches[0], dx = t.clientX - tX, dy = t.clientY - tY;

  if(window.__isVertical){
    if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > SWIPE_THRESH){ (dy < 0) ? goNext() : goPrev(); tX=tY=null; return; }
    if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > SWIPE_THRESH){ currentHalf().step(dx < 0 ? +1 : -1); tX=tY=null; return; }
  }else{
    if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > SWIPE_THRESH){ (dx < 0) ? goNext() : goPrev(); tX=tY=null; return; }
    if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > SWIPE_THRESH){ currentHalf().step(dy < 0 ? +1 : -1); tX=tY=null; return; }
  }
},{passive:true});
document.addEventListener('touchend', ()=>{ tX=null; tY=null; });

/* ========= Tastiera: ↑/↓ per scorrere i progetti ========= */
document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowUp'){   e.preventDefault(); currentHalf().step(-1); }
  if(e.key === 'ArrowDown'){ e.preventDefault(); currentHalf().step(+1); }
});
</script>
</body>
