<style>
  :root{
    --bg:#0a0a0d; --text:#e9e9ef; --muted:#b9b9c4; --accent:#9ee7ff; --border:rgba(255,255,255,.12);

    /* Header / Footer alti uguali */
    --head-h: calc(78px + env(safe-area-inset-top));
    --foot-h: var(--head-h);

    /* ===== geometria COLONNA ===== */
    --card-w: 320px;
    --card-h: 180px;
    --card-gap: 16px;
    --card-radius: 16px;

    /* crescita/scale (rettangoli invariati) */
    --card-scale-active: 1.28;
    --card-scale-hover:  1.08;

    /* glow e attenuazione */
    --fade-step: .18;
    --max-dim: 6;
    --active-gap: 48px;

    --flyMs: 520ms;
    --fadeMs: 340ms;
  }

  html,body{height:100%}
  body{
    margin:0; overflow:hidden; color:var(--text);
    background: radial-gradient(1200px 600px at 20% 40%, rgba(158,231,255,.08), transparent 70%),
                linear-gradient(180deg,#0b0c10 0%,#07070a 100%);
    font-family: "Montserrat", system-ui, Arial, sans-serif;
  }

  /* ===== HEADER ===== */
  .portfolio-header{
    position:fixed; inset:0 0 auto 0; z-index:50;
    background: linear-gradient(180deg, rgba(10,12,16,.78), rgba(10,12,16,.35) 55%, transparent);
    backdrop-filter: blur(6px);
    border-bottom:1px solid rgba(158,231,255,.18);
  }
  .ph-inner{
    display:grid; grid-template-columns:auto 1fr auto; align-items:center;
    gap:12px;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 8px;
  }
  .ph-title{
    margin:0;
    text-align:center;
    font-family:"Bebas Neue", sans-serif;
    font-weight:400;
    font-size:clamp(24px, 4.2vw, 44px);
    line-height:1;
    letter-spacing:.18em;
    color:var(--text);
  }
  .ph-line{
    height:3px; margin:6px 16px 10px; border-radius:999px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow: 0 0 24px rgba(158,231,255,.45);
  }

  .chip{
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(18,20,26,.92); color:var(--text);
    border:1px solid var(--border); border-radius:999px;
    padding:10px 14px; font-weight:600; text-decoration:none;
    box-shadow:0 8px 22px rgba(0,0,0,.35);
    transition: transform .15s ease, background .2s ease, color .2s ease, border-color .2s ease;
  }
  .chip:hover{ background:var(--accent); color:#0b0c10; border-color: rgba(158,231,255,.6); transform: translateY(-1px); }
  .back-btn{ position:static; }
  .ph-spacer{ visibility:hidden; }

  /* ===== FOOTER SPECULARE (vuoto + switch dentro) ===== */
  .portfolio-footer{
    position:fixed; inset:auto 0 0 0; z-index:50;
    background: linear-gradient(0deg, rgba(10,12,16,.78), rgba(10,12,16,.35) 55%, transparent);
    backdrop-filter: blur(6px);
    border-top:1px solid rgba(158,231,255,.18);
    height: var(--foot-h);
    pointer-events:none;
  }
  .portfolio-footer .footer-inner{
    height:100%;
    display:flex; align-items:center; justify-content:flex-end;
    padding: 0 18px;
    pointer-events:auto;
  }
  body.on-right .portfolio-footer .footer-inner{ justify-content:flex-start; }
  .switch-btn{ position:static; }

  /* ===== WRAPPER ===== */
  .viewport{
    position:absolute; left:0; right:0; top:var(--head-h); bottom:var(--foot-h);
    overflow:hidden;
  }
  .portfolio-wrapper{
    position:absolute; inset:0;
    width:200vw; height:100%;
    display:flex; flex-direction:row;
    transition: transform .6s cubic-bezier(.22,.8,.24,1);
    will-change: transform;
  }
  .portfolio-wrapper.to-right{ transform: translateX(-100vw); }
  .half{ position:relative; width:100vw; height:100%; overflow:hidden; }

  /* ===== BACKGROUND / SCRIM ===== */
  .preview-img{
    position:absolute; inset:0; z-index:0;
    background:#000 center/cover no-repeat;
    transition: opacity var(--fadeMs) ease;
    will-change: opacity, background-image;
  }
  .preview-img.hidden{ opacity:0; }

  .scrim{
    position:absolute; inset:0; z-index:3; pointer-events:none;
    background:
      radial-gradient(60% 60% at 15% 50%, rgba(0,0,0,.08), transparent 70%),
      linear-gradient(to right, rgba(7,7,10,0) 0%, rgba(0,0,0,0.35) 70%, rgba(0,0,0,0.75) 100%),
      linear-gradient(90deg, rgba(7,7,10,.55) 0%, rgba(7,7,10,.22) 35%, rgba(7,7,10,0) 60%);
  }
  .half-right .scrim{
    background:
      radial-gradient(60% 60% at 85% 50%, rgba(0,0,0,.08), transparent 70%),
      linear-gradient(to left, rgba(7,7,10,0) 0%, rgba(0,0,0,0.35) 70%, rgba(0,0,0,0.75) 100%),
      linear-gradient(270deg, rgba(7,7,10,.55) 0%, rgba(7,7,10,.22) 35%, rgba(7,7,10,0) 60%);
  }

  /* ===== INFO ===== */
  .preview-info{ position:absolute; left:44px; bottom:44px; z-index:4; max-width:min(70ch, 60vw);
    text-shadow: 0 4px 18px rgba(0,0,0,.75), 0 0 8px rgba(0,0,0,.5);
    transition: opacity var(--fadeMs) ease, transform var(--fadeMs) ease;
  }
  .preview-info.hidden{ opacity:0; transform:translateY(8px); pointer-events:none; }
  .kicker{ font-size:.85rem; letter-spacing:.18em; color:var(--accent); text-transform:uppercase; }
  .title{ font-size: clamp(28px, 4.6vw, 64px); line-height:1.02; margin:6px 0 0; }
  .subtitle{ margin:6px 0 0; font-size: clamp(14px, 1.4vw, 18px); color:var(--muted); }
  .cta{ margin-top:14px; display:inline-flex; align-items:center; gap:10px; font-weight:600; text-decoration:none; color:#0b0c10; background:var(--accent); padding:10px 14px; border-radius:999px; transition: box-shadow .22s ease, transform .15s ease, filter .22s ease; }
  .cta:hover,.cta:focus-visible{ box-shadow: 0 0 24px rgba(158,231,255,.35), inset 0 0 10px rgba(255,255,255,.35); transform: translateY(-1px); filter: brightness(1.03); }
  .half-right .preview-info{ left:auto; right:44px; text-align:right; }
  body.vertical .preview-info{ display:none !important; }

  /* ===== FRECCE ===== */
  .arc-wrap{ position:absolute; inset:0; z-index:31; width:100%; height:100%; pointer-events:none; }
  .arc-btn{
    position:absolute; z-index:31; pointer-events:auto;
    width:46px; height:46px; border-radius:12px; border:1px solid var(--border);
    background:rgba(18,20,26,.92); color:var(--text); display:grid; place-items:center;
    cursor:pointer; font-size:18px; line-height:1;
    box-shadow:0 8px 28px rgba(0,0,0,.35);
    transition: transform .15s ease, outline-color .15s ease, opacity .2s ease;
  }
  .arc-btn:hover{ outline:1px solid rgba(158,231,255,.45); transform: translateY(-1px) scale(1.02); }
  .arc-btn[disabled]{ opacity:.35; pointer-events:none; }

  /* === Fly ===== */
  .fly{
    position:absolute; z-index:2;
    background:#000 center/cover no-repeat; border-radius:16px;
    box-shadow: 0 16px 34px rgba(0,0,0,.55);
    transition:left var(--flyMs) cubic-bezier(.22,.8,.24,1),
      top var(--flyMs) cubic-bezier(.22,.8,.24,1),
      width var(--flyMs) cubic-bezier(.22,.8,.24,1),
      height var(--flyMs) cubic-bezier(.22,.8,.24,1),
      border-radius var(--flyMs) ease,
      transform var(--flyMs) cubic-bezier(.22,.8,.24,1),
      opacity var(--flyMs) ease;
    pointer-events:none;
  }

  /* ===== COLONNA ===== */
  .col-wrap{
    position:absolute; top:50%; transform:translateY(-50%); z-index:20; height: 80%; pointer-events:none;
    display:flex; align-items:center;
  }
  .half-left .col-wrap{ right:24px; }
  .half-right .col-wrap{ left:24px; }

  .column{
    position:relative; width: var(--card-w); height:100%;
    pointer-events:auto; overflow:visible;
  }

  .half-left .card{ transform-origin: 100% 50%; }
  .half-right .card{ transform-origin: 0% 50%; }

  .card{
    position:absolute; left:0; width: var(--card-w); height: var(--card-h);
    border-radius: var(--card-radius);
    border:1px solid var(--border);
    background: rgba(16,18,24,.86);
    box-shadow: 0 10px 28px rgba(0,0,0,.45), 0 0 0 rgba(158,231,255,0);
    transition: transform .22s ease, box-shadow .2s ease, border-color .2s ease, filter .2s ease, opacity .2s ease, top .22s ease;
    will-change: transform, top;
    cursor:pointer;
    display:grid; grid-template-rows: 1fr auto;
    overflow:hidden;
    z-index:1;
    --dim: 0;
    opacity: calc(1 - min(var(--dim), var(--max-dim))*var(--fade-step));
    filter: saturate(calc(1 - min(var(--dim), var(--max-dim))*.18));
    --inward: 0px;
    --scale: 1;
    transform: translateX(var(--inward)) scale(var(--scale));
  }
  .card .thumb{
    background: #0b0c10 center/cover no-repeat;
    filter: grayscale(calc(.15 + min(var(--dim),var(--max-dim))*.15))
            brightness(calc(1 - min(var(--dim),var(--max-dim))*.10))
            contrast(calc(1 - min(var(--dim),var(--max-dim))*.06));
    transition: transform .25s ease, filter .2s ease;
  }
  .card .meta{
    padding:10px 12px; backdrop-filter: blur(2px);
    background: linear-gradient(180deg, transparent, rgba(10,12,16,.6));
  }
  .card .title{ font-size:14px; font-weight:700; margin:0 0 2px; }
  .card .subtitle{ font-size:12px; color:var(--muted); margin:0; }

  .card.active{
    --scale: var(--card-scale-active);
    z-index:3;
    box-shadow:
      0 18px 44px rgba(0,0,0,.65),
      0 0 26px rgba(158,231,255,.25),
      0 0 54px rgba(158,231,255,.22);
    border-color: rgba(158,231,255,.65);
    opacity:1;
    filter:none;
  }
  .half-left .card.active{  --inward: -28px; }
  .half-right .card.active{ --inward:  28px; }

  .card.active::after{
    content:""; position:absolute; inset:-2px; border-radius:inherit; pointer-events:none;
    box-shadow: 0 0 30px rgba(158,231,255,.35), inset 0 0 24px rgba(158,231,255,.12);
  }

  .card.hovered:not(.active){
    --scale: var(--card-scale-hover);
    z-index:2;
    box-shadow: 0 14px 34px rgba(0,0,0,.55), 0 0 20px rgba(158,231,255,.18);
    border-color: rgba(158,231,255,.38);
    opacity:.98;
  }

  /* ===== CTA compatta (solo verticale) ===== */
  .edge-cta{
    position:absolute; z-index:32; display:none;
    align-items:center; justify-content:center;
    font-weight:700; text-decoration:none; color:#0b0c10;
    background:var(--accent);
    padding:8px 12px;
    border-radius:999px;
    box-shadow:0 10px 24px rgba(0,0,0,.4);
    text-align:center;
    line-height:1.05;
    white-space:nowrap;
    pointer-events:auto;
    font-size:12.5px;
    gap:0;
  }
  body.vertical .edge-cta{ display:inline-flex; }

  /* ===================== */
  /* ✅ ADD: COMING SOON UI */
  /* ===================== */
  .card.coming-soon{
    cursor:default;
    opacity:.72;
    filter: grayscale(1) saturate(.2) brightness(.78);
  }
  .card.coming-soon.hovered:not(.active){
    --scale: 1;
    box-shadow: 0 10px 28px rgba(0,0,0,.45);
    border-color: var(--border);
  }
  .card.coming-soon.active{
    box-shadow: 0 18px 44px rgba(0,0,0,.55);
    border-color: rgba(255,255,255,.14);
  }
  .card.coming-soon.active::after{ display:none; }

  .card .thumb{ position:relative; }

  /* ✅ qui il centraggio perfetto */
  .coming-soon-badge{
    position:absolute; inset:0;
    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
    line-height:1;
    padding:14px;

    background: rgba(10,12,16,.55);
    backdrop-filter: blur(2px);
    font-family:"Bebas Neue", sans-serif;
    letter-spacing:.18em;
    font-size: clamp(18px, 2.2vw, 26px);
    color: rgba(233,233,239,.82);
    text-shadow: 0 6px 18px rgba(0,0,0,.65);
    pointer-events:none;
  }

  @media (max-width: 1200px){ :root{ --card-w: 300px; --card-h: 168px; } }
  @media (max-width: 900px){  :root{ --card-w: 280px; --card-h: 160px; } }
  @media (max-width: 600px){  :root{ --card-w: 260px; --card-h: 150px; } }
  @media (max-width: 430px){  :root{ --card-w: 230px; --card-h: 140px; } }
</style>

/* ========= UTIL ========= */
const byId = id => document.getElementById(id);
function preloadImage(src){
  return new Promise(resolve=>{
    if(!src) return resolve();
    const im = new Image();
    im.onload = resolve; im.onerror = resolve;
    im.decode ? im.decode().then(resolve).catch(resolve) : null;
    im.src = src;
  });
}
function crossfadeBg(bgEl, url){
  if(!bgEl) return;
  if(!url){
    bgEl.classList.add('hidden');
    bgEl.style.backgroundImage = 'none';
    return;
  }
  bgEl.classList.add('hidden');
  requestAnimationFrame(()=>{
    bgEl.style.backgroundImage = `url("${url}")`;
    requestAnimationFrame(()=> bgEl.classList.remove('hidden'));
  });
}

/* ========= COMPONENTE COLONNA ========= */
function HalfColumn(opts){
  const { rootEl, colEl, infoEls, projects, side, arrows, edgeCtaEl } = opts;

  const data = projects.map(p=>({...p}));

  let activeIndex = 0;
  let animating   = false;
  let frozenAnchor = null;
  let wheelCooldown = false;

  function slotSize(){
    const cs = getComputedStyle(document.documentElement);
    const ch = parseFloat(cs.getPropertyValue('--card-h')) || 180;
    const gap= parseFloat(cs.getPropertyValue('--card-gap')) || 16;
    return ch + gap;
  }
  function centerY(){ return colEl.clientHeight / 2; }
  function isVertical(){ return document.body.classList.contains('vertical'); }

  const items = data.map((p, i)=>{
    const card = document.createElement('div');
    card.className = 'card';

    if(p.comingSoon){
      card.classList.add('coming-soon');
      card.setAttribute('aria-disabled', 'true');
    }

    const thumb = document.createElement('div');
    thumb.className = 'thumb';

    if(p.comingSoon){
      thumb.style.backgroundImage = 'none';
      const badge = document.createElement('div');
      badge.className = 'coming-soon-badge';
      badge.textContent = 'COMING SOON';
      thumb.appendChild(badge);
    }else{
      thumb.style.backgroundImage = `url('${p.thumb || ''}')`;
    }

    const meta  = document.createElement('div'); meta.className = 'meta';
    const t = document.createElement('p'); t.className='title'; t.textContent = p.title || '—';
    const s = document.createElement('p'); s.className='subtitle'; s.textContent = p.subtitle || '';
    meta.appendChild(t); meta.appendChild(s);
    card.appendChild(thumb); card.appendChild(meta);

    card.addEventListener('mouseenter', ()=> card.classList.add('hovered'));
    card.addEventListener('mouseleave', ()=> card.classList.remove('hovered'));

    /* ✅ click SOLO se non è coming soon */
    if(!p.comingSoon){
      card.addEventListener('click', (ev)=>{ ev.stopPropagation(); if(!animating) goTo(i); });
    }

    colEl.appendChild(card);
    return { card, thumb };
  });

  function layout(){
    const slot = slotSize();
    const h = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-h')) || 180;
    const EXTRA = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--active-gap')) || 48);

    items.forEach((it, i)=>{
      const d = i - activeIndex;
      const baseY = Math.round(centerY() + d*slot - (h/2));
      const sep = d>0 ?  (EXTRA/2) : (d<0 ? -(EXTRA/2) : 0);
      it.card.style.top = (baseY + sep) + 'px';
      it.card.style.setProperty('--dim', Math.abs(d));
      it.card.classList.toggle('active', i===activeIndex);
    });

    positionControls();
  }

  function computeAnchor(){
    const rootBox = rootEl.getBoundingClientRect();
    const colBox = colEl.getBoundingClientRect();

    const cs = getComputedStyle(document.documentElement);
    const cardW = parseFloat(cs.getPropertyValue('--card-w')) || 320;
    const cardH = parseFloat(cs.getPropertyValue('--card-h')) || 180;
    const scale = parseFloat(cs.getPropertyValue('--card-scale-active')) || 1.28;
    const inward = (side==='left' ? -28 : 28);

    const visW = cardW * scale;
    const visH = cardH * scale;

    const centerTop  = Math.round(colBox.top - rootBox.top + (colEl.clientHeight - visH)/2);
    const centerLeft = Math.round(colBox.left - rootBox.left + inward - (visW - cardW)/2);
    const cardRight  = centerLeft + visW;

    const arrowsGap = 12;
    const upBtn = arrows.up, downBtn = arrows.down;

    let leftX;
    if(side === 'left'){
      leftX = Math.max(6, centerLeft - upBtn.offsetWidth - arrowsGap);
    }else{
      leftX = Math.min(rootEl.clientWidth - upBtn.offsetWidth - 6, cardRight + arrowsGap);
    }

    const upTop   = Math.max(6, centerTop - upBtn.offsetHeight - 8);
    const downTop = Math.min(rootEl.clientHeight - downBtn.offsetHeight - 6, centerTop + visH + 8);

    let ctaLeft = null, ctaTop = null;
    if(edgeCtaEl && isVertical()){
      edgeCtaEl.style.display = 'inline-flex';
      const ctaW = edgeCtaEl.offsetWidth || 84;
      const ctaH = edgeCtaEl.offsetHeight || 32;
      if(side === 'left'){
        ctaLeft = Math.max(6, centerLeft - ctaW - 10);
      }else{
        ctaLeft = Math.min(rootEl.clientWidth - ctaW - 6, cardRight + 10);
      }
      ctaTop  = Math.round(centerTop + (visH - ctaH)/2);
    }

    return { leftX, upTop, downTop, ctaLeft, ctaTop };
  }

  function applyAnchor(a){
    if(!a) return;
    arrows.up.style.left = a.leftX + 'px';
    arrows.up.style.top  = a.upTop + 'px';
    arrows.down.style.left = a.leftX + 'px';
    arrows.down.style.top  = a.downTop + 'px';

    if(edgeCtaEl){
      if(isVertical()){
        edgeCtaEl.style.display = 'inline-flex';
        if(a.ctaLeft!=null) edgeCtaEl.style.left = a.ctaLeft + 'px';
        if(a.ctaTop!=null)  edgeCtaEl.style.top  = a.ctaTop  + 'px';
      }else{
        edgeCtaEl.style.display = 'none';
      }
    }
  }

  function positionControls(){
    if(frozenAnchor){ applyAnchor(frozenAnchor); return; }
    applyAnchor(computeAnchor());
  }

  function updateInfo(applyBg=true){
    const p = data[activeIndex];

    if(p.comingSoon){
      if(applyBg) crossfadeBg(infoEls.bg, "");
      infoEls.title && (infoEls.title.textContent = p.title || '');
      infoEls.sub && (infoEls.sub.textContent   = 'COMING SOON');

      if(infoEls.link){
        infoEls.link.href = '#';
        infoEls.link.style.display = 'none';
      }
      if(edgeCtaEl){
        edgeCtaEl.href = '#';
        edgeCtaEl.style.display = 'none';
      }
      return;
    }

    if(infoEls.link) infoEls.link.style.display = '';
    if(applyBg) crossfadeBg(infoEls.bg, p.cover);
    infoEls.title && (infoEls.title.textContent = p.title || '');
    infoEls.sub && (infoEls.sub.textContent   = p.subtitle || '');
    infoEls.link && (infoEls.link.href         = p.href || '#');
    if(edgeCtaEl) edgeCtaEl.href = p.href || '#';
  }

  function updateArcButtons(){
    const atFirst = activeIndex === 0, atLast = activeIndex === data.length - 1;
    arrows.up.disabled   = atFirst;
    arrows.down.disabled = atLast;
    [arrows.up, arrows.down].forEach(b=> b.style.display = data.length>1 ? '' : 'none');
  }

  function getFlyDir(){ return (side==='left' ? 'right' : 'left'); }

  function flyScreen(dir, img){
    return new Promise(resolve=>{
      if(!img) return resolve();

      const fly = document.createElement('div');
      fly.className = 'fly';
      fly.style.backgroundImage = `url('${img}')`;

      const w = rootEl.clientWidth;
      const h = rootEl.clientHeight;

      let x0=0, y0=0;
      if(dir==='left'){ x0 = -w; }
      if(dir==='right'){ x0 =  w; }
      if(dir==='up'){ y0 =  h; }
      if(dir==='down'){ y0 = -h; }

      Object.assign(fly.style,{
        left: x0+'px', top: y0+'px', width: w+'px', height: h+'px', borderRadius:'0px', opacity:'1'
      });

      rootEl.appendChild(fly);
      void fly.getBoundingClientRect();
      fly.style.left = '0px';
      fly.style.top  = '0px';
      fly.style.transform = 'translate(0,0)';

      const finish = ()=>{ fly.remove(); resolve(); };
      fly.addEventListener('transitionend', finish, {once:true});
      setTimeout(finish, (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--flyMs'))||520)+120);
    });
  }

  async function goTo(target){
    if (animating || target === activeIndex) return;
    animating = true; document.body.classList.add('nohover');

    infoEls.infoBox?.classList.add('hidden');

    frozenAnchor = computeAnchor();
    applyAnchor(frozenAnchor);

    activeIndex = target;
    updateArcButtons();
    layout();

    const p = data[activeIndex];
    await Promise.all([ flyScreen(getFlyDir(), p.cover), preloadImage(p.cover) ]);

    updateInfo(true);
    infoEls.infoBox?.classList.remove('hidden');

    frozenAnchor = null;
    positionControls();

    animating = false; document.body.classList.remove('nohover');
  }

  const step = dir => {
    const i = Math.min(Math.max(activeIndex + dir, 0), data.length - 1);
    goTo(i);
  };

  function handleWheel(dir){ if (wheelCooldown || animating) return; wheelCooldown=true; document.body.classList.add('nohover'); step(dir); setTimeout(()=>{wheelCooldown=false; document.body.classList.remove('nohover');},260); }
  function attachWheel(el){
    if(!el) return;
    el.addEventListener('wheel', (e)=>{
      if (Math.abs(e.deltaY) < 10 || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      e.preventDefault(); e.stopPropagation();
      handleWheel(e.deltaY > 0 ? +1 : -1);
    }, {passive:false});
  }
  attachWheel(colEl); attachWheel(colEl.parentElement); attachWheel(rootEl);

  arrows.up.addEventListener('click',   ()=> step(-1));
  arrows.down.addEventListener('click', ()=> step(+1));

  function start(){
    activeIndex = Math.floor((data.length - 1) / 2);
    layout();
    updateInfo(true);
    infoEls.infoBox?.classList.remove('hidden');
    updateArcButtons();
  }

  window.addEventListener('resize', ()=>{
    layout();
    positionControls();
  });

  start();
  return { step, goTo, layout, positionControls };
}

/* ========= SWITCH / LAYOUT ========= */
const wrapper = byId('wrapper');
const switchBtn = byId('switchBtn');
let onRight = false;

const infoBoxA = byId('infoA');
const infoBoxB = byId('infoB');

let halfA, halfB;

function isVerticalLayout(){ return innerHeight > innerWidth; }
function updateSwitchLabel(){
  switchBtn.textContent = onRight ? 'Back to 3D Portfolio ←' : 'Concepts & Artworks →';
  document.body.classList.toggle('on-right', onRight);
}
function toggleInfoVisibility(){
  const v = window.__isVertical;
  if(infoBoxA) infoBoxA.style.display = v ? 'none' : '';
  if(infoBoxB) infoBoxB.style.display = v ? 'none' : '';
}

let __lastIsVertical;
function applyLayout(){
  const prev = __lastIsVertical;
  window.__isVertical = isVerticalLayout();
  __lastIsVertical = window.__isVertical;

  document.body.classList.toggle('vertical', window.__isVertical);

  wrapper.classList.toggle('to-right', onRight);

  updateSwitchLabel();
  toggleInfoVisibility();

  setTimeout(()=> {
    window.dispatchEvent(new Event('resize'));
    halfA?.positionControls?.();
    halfB?.positionControls?.();
  }, 0);
}
applyLayout();

window.addEventListener('resize', applyLayout);
window.addEventListener('orientationchange', applyLayout);

/* ========= ISTANZE ========= */
halfA = new HalfColumn({
  rootEl: byId('halfLeft'),
  colEl: byId('colA'),
  infoEls: { bg: byId('bgA'), title: byId('titleA'), sub: byId('subA'), link: byId('linkA'), infoBox: byId('infoA') },
  projects: PROJECTS_LEFT,
  side: 'left',
  arrows: { up: byId('upA'), down: byId('downA') },
  edgeCtaEl: byId('edgeCtaA')
});

halfB = new HalfColumn({
  rootEl: byId('halfRight'),
  colEl: byId('colB'),
  infoEls: { bg: byId('bgB'), title: byId('titleB'), sub: byId('subB'), link: byId('linkB'), infoBox: byId('infoB') },
  projects: PROJECTS_RIGHT,
  side: 'right',
  arrows: { up: byId('upB'), down: byId('downB') },
  edgeCtaEl: byId('edgeCtaB')
});

window.dispatchEvent(new Event('resize'));
applyLayout();

function goNext(){
  onRight = true;
  wrapper.classList.add('to-right');
  updateSwitchLabel();
  halfA.positionControls(); halfB.positionControls();
}
function goPrev(){
  onRight = false;
  wrapper.classList.remove('to-right');
  updateSwitchLabel();
  halfA.positionControls(); halfB.positionControls();
}
switchBtn.addEventListener('click', ()=> (onRight ? goPrev() : goNext()));

let tX=null,tY=null; const SWIPE_THRESH = 60;
function currentHalf(){ return onRight ? halfB : halfA; }

document.addEventListener('touchstart', (e)=>{ const t = e.touches[0]; tX = t.clientX; tY = t.clientY; }, {passive:true});
document.addEventListener('touchmove', (e)=>{
  if(tX===null) return;
  const t = e.touches[0], dx = t.clientX - tX, dy = t.clientY - tY;

  if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > SWIPE_THRESH){
    (dx < 0) ? goNext() : goPrev(); tX=tY=null; return;
  }
  if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > SWIPE_THRESH){
    currentHalf().step(dy < 0 ? +1 : -1); tX=tY=null; return;
  }
},{passive:true});
document.addEventListener('touchend', ()=>{ tX=null; tY=null; });

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowUp'){   e.preventDefault(); currentHalf().step(-1); }
  if(e.key === 'ArrowDown'){ e.preventDefault(); currentHalf().step(+1); }
});
</script>
