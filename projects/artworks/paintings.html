<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Painting Collection</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --page-max: 1280px;
    --heroPadFallback: clamp(24px, 8vh, 100px);
    --border: rgba(255,255,255,.12);
    --muted: #bfc1ca;
  }

  /* Base */
  *,*::before,*::after{ box-sizing:border-box }
  html,body{ height:100% }
  body{
    margin:0; color:#fff;
    font-family:"Montserrat", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    display:flex; justify-content:center;
    background:#000; overflow-x:hidden;
  }

  /* Background */
  .bg-img{
    position:fixed; inset:0; z-index:-2;
    background:url('images/background.png') center/cover no-repeat fixed;
    filter: brightness(1);
  }
  .bg-overlay{
    position:fixed; inset:0; z-index:-1;
    background:rgba(0,0,0,.35);
  }

  /* Container */
  .container{
    width:100%; max-width:var(--page-max);
    padding:0 20px 80px;
  }

  /* Back */
  .back-btn{
    position:fixed; top:20px; left:20px; z-index:10;
    font-size:16px; font-weight:600; color:#fff;
    background:rgba(18,20,26,.92);
    padding:8px 14px; border-radius:10px;
    border:1px solid var(--border); text-decoration:none;
    box-shadow:0 6px 20px rgba(0,0,0,.35);
    transition:background .2s ease, color .2s ease, transform .12s ease;
  }
  .back-btn:hover{ background:#9ee7ff; color:#0b0c10; transform:translateY(-1px); }

  /* HERO con letterbox dinamico */
  .hero{ position:relative; margin:72px 0 28px; }
  .hero-media{
    position:relative;
    padding-bottom: var(--heroPad, var(--heroPadFallback));
    background:#000; border-radius:12px; overflow:hidden;
  }
  .hero-media img{
    width:100%; height:auto; display:block; border-radius:12px;
    filter: drop-shadow(0 30px 60px rgba(0,0,0,.75)) drop-shadow(0 8px 20px rgba(0,0,0,.55));
    background:transparent;
  }
  .hero-media::after{
    content:"";
    position:absolute; inset:0;
    background:rgba(0,0,0,.6);
    filter:blur(24px);
    transform:translateY(10px);
    -webkit-mask-image:url("images/header-image.png");
    -webkit-mask-repeat:no-repeat;
    -webkit-mask-position:center;
    -webkit-mask-size:contain;
            mask-image:url("images/header-image.png");
            mask-repeat:no-repeat;
            mask-position:center;
            mask-size:contain;
    pointer-events:none;
  }
  .hero-overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:flex-end; gap:12px;
    padding: clamp(14px,3.5vw,28px) clamp(14px,3.5vw,24px);
    pointer-events:none;
  }
  .hero-inner{
    pointer-events:auto;
    margin:0 auto;
    width:100%;
    max-width:min(980px,96%);
    display:flex; flex-direction:column; gap:8px;
  }
  .title{
    margin:0; font-weight:700;
    font-size: clamp(22px, 3.8vw, 38px);
    line-height:1.12; text-shadow:0 2px 10px rgba(0,0,0,.6);
  }
  .intro{
    margin:0;
    font-size: clamp(14px, 1.85vw, 18px);
    line-height:1.55; color:#e9e9e9;
    text-shadow:0 2px 8px rgba(0,0,0,.55);
    max-width:min(980px,96%);
  }

  .divider{ width:100%; height:1px; background:var(--border); margin: 22px 0; opacity:.9; }

  /* Galleria verticale */
  .gallery{
    display:flex; flex-direction:column; gap:32px;
    align-items:center;
  }

  figure.art{
    width:100%;
    max-width:min(980px, 96%);
    margin:0;
    border:1px solid var(--border);
    border-radius:12px;
    background:#000;
    box-shadow:0 14px 36px rgba(0,0,0,.35);
    overflow:hidden;
    padding:12px;                /* un filo di padding per distanziare immagine e bordi */
  }

  .art-main{
    width:100%; background:#000; border-radius:8px; overflow:hidden;
    border:1px solid var(--border);
  }
  .art-main img{
    display:block; width:100%; height:auto; background:#000;
  }

  /* Thumbnails sotto l’immagine principale */
  .thumbs{
    display:flex; flex-wrap:wrap; justify-content:center; gap:10px;
    margin-top:12px;
  }
  .thumbs img{
    height:76px; width:auto; border-radius:8px; cursor:pointer;
    border:2px solid transparent; background:#000; display:block;
    transition: transform .15s ease, border-color .15s ease, filter .15s ease;
    filter: grayscale(70%) brightness(1.05);
  }
  .thumbs img:hover, .thumbs img:focus-visible{
    transform: scale(1.05); border-color:#ffc24b; filter:grayscale(0) brightness(1);
    outline:none;
  }
  .thumbs img.active{ border-color:#ffc24b; filter:grayscale(0) brightness(1); }

  /* Didascalia piccola */
  figcaption{
    margin-top:10px;
    font-size:.92rem; color:#ddd; text-align:left;
  }
  .meta{
    color:var(--muted); font-size:.88rem; margin-top:2px;
    display:flex; flex-wrap:wrap; gap:10px 16px;
  }
  .meta span{ white-space:nowrap; }

  /* Media helpers */
  img,video,canvas,svg{ max-width:100%; height:auto }

  @media (max-width: 900px){
    .hero-media{ border-radius:10px; }
    .hero-media img{ border-radius:10px; }
    figure.art{ border-radius:10px; }
  }
</style>
</head>
<body>
  <!-- Background -->
  <div class="bg-img" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <!-- Back -->
  <a href="../../portfolio.html" class="back-btn">← Back</a>

  <div class="container">
    <!-- HERO -->
    <header class="hero" id="hero">
      <div class="hero-media" id="heroMedia">
        <!-- PNG consigliato (può avere trasparenze) -->
        <img src="images/header-image.png" alt="Painting Collection — header" />
      </div>
      <div class="hero-overlay">
        <div class="hero-inner" id="heroContent">
          <h1 class="title">Painting Collection</h1>
          <p class="intro">
            A personal gallery of my paintings and studies. Each piece includes its technical details —
            title, year, medium, and dimensions.
          </p>
        </div>
      </div>
    </header>

    <div class="divider" aria-hidden="true"></div>

    <!-- GALLERIA -->
    <main class="gallery" aria-label="Painting gallery">

      <!-- ===== DIPINTO 1 ===== -->
      <figure class="art">
        <div class="art-main">
          <img src="images/paintings/forest/forest-01.jpg" alt="Forest Morning — main image">
        </div>
        <div class="thumbs">
          <img src="images/paintings/forest/forest-01.jpg" alt="Forest Morning — view A" class="active">
          <img src="images/paintings/forest/forest-02.jpg" alt="Forest Morning — detail 1">
          <img src="images/paintings/forest/forest-03.jpg" alt="Forest Morning — detail 2">
        </div>
        <figcaption>
          <strong>Forest Morning</strong>
          <div class="meta">
            <span>2023</span>
            <span>Oil on canvas</span>
            <span>60 × 80 cm</span>
          </div>
        </figcaption>
      </figure>

      <!-- ===== DIPINTO 2 ===== -->
      <figure class="art">
        <div class="art-main">
          <img src="images/paintings/city/city-01.jpg" alt="City Rain — main image">
        </div>
        <div class="thumbs">
          <img src="images/paintings/city/city-01.jpg" alt="City Rain — view A" class="active">
          <img src="images/paintings/city/city-02.jpg" alt="City Rain — detail 1">
          <img src="images/paintings/city/city-03.jpg" alt="City Rain — detail 2">
          <img src="images/paintings/city/city-04.jpg" alt="City Rain — detail 3">
        </div>
        <figcaption>
          <strong>City Rain</strong>
          <div class="meta">
            <span>2022</span>
            <span>Acrylic on paper</span>
            <span>30 × 42 cm</span>
          </div>
        </figcaption>
      </figure>

      <!-- ===== DIPINTO 3 ===== -->
      <figure class="art">
        <div class="art-main">
          <img src="images/paintings/still-life/still-01.jpg" alt="Still Life — main image">
        </div>
        <div class="thumbs">
          <img src="images/paintings/still-life/still-01.jpg" alt="Still Life — view A" class="active">
          <img src="images/paintings/still-life/still-02.jpg" alt="Still Life — detail 1">
        </div>
        <figcaption>
          <strong>Still Life</strong>
          <div class="meta">
            <span>2021</span>
            <span>Watercolor</span>
            <span>24 × 32 cm</span>
          </div>
        </figcaption>
      </figure>

      <!-- Duplica altri <figure class="art">…</figure> con lo stesso schema -->
    </main>
  </div>

  <script>
    // Letterbox dinamico: mantiene i testi ancorati in basso quando lo schermo si restringe
    function adjustHeroPad(){
      const media = document.getElementById('heroMedia');
      const content = document.getElementById('heroContent');
      if(!media || !content) return;

      const portrait = window.innerHeight > window.innerWidth;
      let pad = 0;
      if (portrait) {
        const contentH = content.getBoundingClientRect().height;
        const extra = 8;
        const maxPad = Math.floor(window.innerHeight * 0.36);
        const minPad = 24;
        pad = Math.max(minPad, Math.min(maxPad, Math.ceil(contentH + extra)));
      }
      media.style.setProperty('--heroPad', pad + 'px');
    }
    window.addEventListener('load', adjustHeroPad);
    window.addEventListener('resize', adjustHeroPad, {passive:true});
    window.addEventListener('orientationchange', adjustHeroPad);
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(adjustHeroPad); }

    // Thumbs -> sostituiscono l'immagine principale del relativo figure.art
    document.querySelectorAll('figure.art').forEach(art => {
      const mainImg = art.querySelector('.art-main img');
      const thumbs  = art.querySelectorAll('.thumbs img');

      thumbs.forEach(t => {
        t.tabIndex = 0; // accessibilità: focus via tastiera
        t.addEventListener('click', () => {
          // swap
          if (t.src !== mainImg.src) {
            mainImg.src = t.src;
            // stato attivo
            thumbs.forEach(x => x.classList.remove('active'));
            t.classList.add('active');
          }
        });
        t.addEventListener('keydown', e => {
          if(e.key === 'Enter' || e.key === ' '){
            e.preventDefault(); t.click();
          }
        });
      });
    });
  </script>
</body>
</html>
