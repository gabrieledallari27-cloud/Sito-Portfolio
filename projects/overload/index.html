<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overload — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      min-height:100%;
      background:#000;
      color:#fff;
      font-family:"Montserrat", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:center;
      overflow-x:hidden;
    }

    .page{
      width:100%;
      max-width:1280px;
      padding:72px 20px 40px;
    }

    .back-btn{
      position:fixed;
      top:18px;
      left:18px;
      z-index:10;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:10px;
      background:rgba(18,20,26,.92);
      border:1px solid rgba(255,255,255,.12);
      color:#e9e9ef;
      text-decoration:none;
      font-weight:600;
      box-shadow:0 6px 20px rgba(0,0,0,.35);
      transition:background .18s ease, color .18s ease, transform .12s ease;
    }

    .back-btn:hover{
      background:#9ee7ff;
      color:#0b0c10;
      transform:translateY(-1px);
    }

    .video-wrap{
      width:100%;
      background:#000;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 30px 80px rgba(0,0,0,.65);
      border:1px solid rgba(255,255,255,.12);
    }

    video{
      width:100%;
      height:auto;
      display:block;
      background:#000;
    }

    .note{
      margin:18px auto 0;
      max-width:760px;
      text-align:center;
      font-size:clamp(12px, 1.6vw, 14px);
      line-height:1.6;
      color:#b9b9c4;
    }

    @media (orientation: portrait){
      body{
        align-items:flex-start;
      }

      .page{
        padding-top:76px;
      }

      .video-wrap{
        border-radius:12px;
      }
    }
  </style>
</head>

<body>
  <a href="../../portfolio.html" class="back-btn">← Back</a>

  <main class="page">
    <div class="video-wrap">
      <video autoplay muted playsinline preload="auto">
        <source src="media/overload-coming-soon.mp4" type="video/mp4">
      </video>
    </div>

    <p class="note">
      Overload is currently being prepared for festival submissions.<br>
      The full project breakdown will be published after the festival run.
    </p>
  </main>
</body>
</html>
