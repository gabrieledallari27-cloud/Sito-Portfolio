<style>
  :root{
    --bg:#0b0c10; --ink:#e9eaef; --muted:#b9b9c4;
    --line:#9ee7ff; --accent:#9ee7ff; --accent-2:#ffc24b;
    --border:rgba(255,255,255,.12);

    --card-w: min(1100px, 94vw);
    --led-thickness: 3px;
    --danger:#ff6b6b;

    /* Fallback per altezza navbar: usato finché JS non misura */
    --nav-pt: 80px; /* default (1 riga) */
  }
  @media (orientation: portrait){
    :root{ --nav-pt: 132px; } /* se la navbar va su 2 righe */
  }

  *{box-sizing:border-box}
  html,body{height:100%}

  body{
    margin:0; color:var(--ink);
    background:
      linear-gradient(180deg, rgba(10,12,16,.78), rgba(10,12,16,.62)),
      url("images/contact/bg.webp") center / cover fixed no-repeat,
      #07070a;
    font-family: "Montserrat", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    display:flex; flex-direction:column; min-height:100svh; overflow-x:hidden;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;

    /* ✅ spazio sotto navbar fissa: dinamico con fallback */
    padding-top: var(--nav-h, var(--nav-pt));
  }
  main{ flex:1 0 auto; }

  /* Grain sopra allo sfondo (sotto i contenuti) */
  .vfx-grain{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:url("images/vfx/film_grain_512.png");
    background-size:140px 140px; background-repeat:repeat;
    mix-blend-mode:soft-light; opacity:.14;
  }

  /* ===== CARD CONTATTI (bordo LED con alone ciano) ===== */
  .wrap{
    padding: clamp(20px,5vw,60px) 20px;
    display:flex; justify-content:center;
  }
  .contact-card{
    width: var(--card-w);
    background: transparent;
    backdrop-filter: none;
    border: var(--led-thickness) solid rgba(255,255,255,.95);
    border-radius: 20px;
    box-shadow:
      0 0 38px rgba(158,231,255,.45),
      0 0 0 1px rgba(255,255,255,.35) inset,
      inset 0 0 12px rgba(255,255,255,.08);
    padding: clamp(18px, 4vw, 40px);
  }

  .grid{
    display:grid;
    grid-template-columns: 1fr 1.1fr;
    gap: clamp(18px, 4vw, 40px);
    align-items:stretch;
  }
  @media (max-width: 900px){ .grid{ grid-template-columns: 1fr; } }

  /* Colonna sinistra: titolo gigante */
  .left-col{ display:flex; align-items:center; }
  .contact-title{
    margin:0; width:100%;
    font-family:"Bebas Neue",sans-serif; font-weight:400;
    font-size:clamp(64px,12vw,220px);
    line-height:.9; letter-spacing:.02em;
    text-shadow:0 0 3px rgba(0,0,0,.4);
  }

  /* ===== FORM ===== */
  form{ width:100%; }
  .row{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  @media (max-width:700px){ .row{ grid-template-columns:1fr; } }
  label{ display:block; font-size:.85rem; color:var(--muted); margin:12px 0 6px; }
  input, textarea{
    width:100%; color:var(--ink); background:transparent;
    border:none; outline:none;
    border-bottom:2px solid rgba(255,255,255,.22);
    padding:10px 4px 12px;
    font:400 1rem/1.4 "Montserrat", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  input:focus, textarea:focus{
    border-bottom-color:var(--line);
    box-shadow:0 6px 20px -8px rgba(158,231,255,.35);
  }
  textarea{ min-height:140px; resize:vertical; }

  .field.invalid input,
  .field.invalid textarea{ border-bottom-color: var(--danger); }
  .error{ color:var(--danger); font-size:.82rem; margin-top:6px; display:none; }
  .field.invalid .error{ display:block; }

  .actions{ display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; align-items:center; }

  /* Pulsante scuro con hover “acceso” */
  .btn{
    appearance:none; border:1px solid var(--border); cursor:pointer;
    color:var(--ink); background:rgba(18,20,26,.92);
    padding:12px 18px; border-radius:999px; font-weight:700; letter-spacing:.02em;
    box-shadow:0 8px 22px rgba(0,0,0,.35);
    transition: transform .15s ease, background .2s ease, color .2s ease, box-shadow .2s ease, filter .2s ease;
    font-family:"Montserrat", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  .btn:hover, .btn:focus-visible{
    background:var(--accent); color:#0b0c10;
    transform:translateY(-1px) scale(1.03);
    box-shadow:0 0 26px rgba(158,231,255,.45), inset 0 0 10px rgba(255,255,255,.18);
    filter:brightness(1.03);
  }
  .btn[disabled]{ opacity:.6; cursor:not-allowed; }

  .note{ color:var(--muted); font-size:.9rem; }
  .success{
    display:none; margin-top:14px; padding:10px 12px; border-radius:12px;
    background:rgba(158,231,255,.10); border:1px solid rgba(158,231,255,.35);
    color:#eaf7ff;
  }

  .recaptcha{ margin-top:14px; }

  /* ===== FOOTER con sole icone ===== */
  .site-footer{
    flex-shrink:0;
    border-top:1px solid var(--border);
    background: linear-gradient(180deg, rgba(10,12,16,.35), rgba(10,12,16,.12));
    backdrop-filter: blur(4px);
  }
  .footer-inner{
    max-width: 980px; margin: 0 auto; padding: 14px 16px;
    display:flex; justify-content:center;
  }
  .socials{ display:flex; align-items:center; gap:14px; }
  .socials a{
    width:44px; height:44px; display:grid; place-items:center;
    border:1px solid var(--border); border-radius:999px;
    color:var(--ink); background:rgba(18,20,26,.70);
    box-shadow:0 8px 22px rgba(0,0,0,.35);
    text-decoration:none;
    transition: transform .15s ease, background .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .socials a:hover, .socials a:focus-visible{
    background:var(--accent); color:#0b0c10; border-color: rgba(158,231,255,.6);
    box-shadow: 0 0 22px rgba(158,231,255,.35), inset 0 0 10px rgba(255,255,255,.18);
    transform: translateY(-1px) scale(1.06);
    outline:none;
  }
  .socials svg{ width:22px; height:22px; stroke-width:1.8; }
  .socials svg *{ vector-effect:non-scaling-stroke; }
</style>
</head>
<body>

  <!-- Navbar via partial -->
  <div data-include="partials/navbar.html"></div>

  <!-- Grain sopra allo sfondo -->
  <div class="vfx-grain" aria-hidden="true"></div>

  <main class="wrap">
    <section class="contact-card" aria-label="Contact form">
      <div class="grid">
        <div class="left-col">
          <h1 class="contact-title">LET’S<br>GET IN<br>TOUCH</h1>
        </div>

        <!-- Netlify form with validation + reCAPTCHA -->
        <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field"
              action="./contact-success.html" id="contactForm" novalidate aria-live="polite">
          <input type="hidden" name="form-name" value="contact">
          <input type="text" name="bot-field" style="display:none" aria-hidden="true">
          <input type="hidden" name="message_to_owner" id="message_to_owner">

          <div class="row">
            <div class="field" id="fName">
              <label for="fullName">Full name *</label>
              <input id="fullName" name="fullName" type="text" autocomplete="name" required aria-required="true">
              <div class="error" role="alert">Please enter your name and surname.</div>
            </div>
            <div class="field" id="fEmail">
              <label for="email">Email *</label>
              <input id="email" name="email" type="email" autocomplete="email" required aria-required="true" inputmode="email">
              <div class="error" role="alert">Please enter a valid email address.</div>
            </div>
          </div>

          <div class="field" id="fMessage">
            <label for="message">Message *</label>
            <textarea id="message" name="message" required aria-required="true"></textarea>
            <div class="error" role="alert">Please write at least 20 characters.</div>
          </div>

          <!-- reCAPTCHA di Netlify -->
          <div class="recaptcha" data-netlify-recaptcha="true"></div>
          <noscript><p class="note">Please enable JavaScript to submit the form.</p></noscript>

          <div class="actions">
            <button class="btn" type="submit" id="submitBtn" disabled>Send</button>
            <span class="note">You’ll get a confirmation on this page.</span>
          </div>

          <p class="success" id="successMsg" role="status" aria-live="polite">Thanks! Your message was sent.</p>
        </form>
      </div>
    </section>
  </main>

  <!-- FOOTER: sole icone -->
  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner">
      <nav class="socials" aria-label="Social links">
        <!-- Email -->
        <a href="mailto:gabrieledallari.art@gmail.com" aria-label="Email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" ry="2"></rect>
            <polyline points="3,7 12,13 21,7"></polyline>
          </svg>
        </a>
        <!-- LinkedIn -->
        <a href="https://www.linkedin.com/in/gabriele-dallari" target="_blank" rel="noopener" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <rect x="2" y="9" width="4" height="12"></rect>
            <circle cx="4" cy="4" r="2"></circle>
            <path d="M10 9h4v2m0 0a4 4 0 0 1 4 4v6h-4v-6a2 2 0 0 0-4 0v6h-4V9h4"></path>
          </svg>
        </a>
        <!-- Instagram -->
        <a href="https://www.instagram.com/gabbodallari" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <circle cx="12" cy="12" r="4.2"></circle>
            <circle cx="17.5" cy="6.5" r="1"></circle>
          </svg>
        </a>
      </nav>
    </div>
  </footer>

  <script src="/js/partials.js?v=v5" defer></script>
  <script>
  // ===== Misura dinamica della navbar e aggiorna padding-top del body
  (function(){
    const root = document.documentElement;

    function setNavHeight(){
      const nb = document.querySelector('.navbar');
      if(!nb) return;
      const h = Math.ceil(nb.getBoundingClientRect().height);
      root.style.setProperty('--nav-h', h + 'px');
      document.body.style.paddingTop = h + 'px';
    }

    // Osserva l'inserimento del partial e i cambi dimensione
    const mo = new MutationObserver(() => {
      const nb = document.querySelector('.navbar');
      if(nb){
        setNavHeight();
        const ro = new ResizeObserver(setNavHeight);
        ro.observe(nb);
      }
    });
    mo.observe(document.body, {childList:true, subtree:true});

    window.addEventListener('load', setNavHeight);
    window.addEventListener('resize', setNavHeight);
    window.addEventListener('orientationchange', setNavHeight);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(setNavHeight);
    }

    setTimeout(setNavHeight, 300);
    setTimeout(setNavHeight, 1000);
  })();

  // --- Validation helpers ---
  const form = document.getElementById('contactForm');
  const btn  = document.getElementById('submitBtn');

  const fields = {
    fullName: {
      el: document.getElementById('fullName'),
      wrap: document.getElementById('fName'),
      test(v){
        const parts = v.trim().split(/\s+/).filter(Boolean);
        return parts.length >= 2 && parts.every(p => /[A-Za-zÀ-ÖØ-öø-ÿ'-]{2,}/.test(p));
      }
    },
    email: {
      el: document.getElementById('email'),
      wrap: document.getElementById('fEmail'),
      test(v){ return /^\S+@\S+\.\S+$/.test(v.trim()); }
    },
    message: {
      el: document.getElementById('message'),
      wrap: document.getElementById('fMessage'),
      test(v){ return v.trim().length >= 20; }
    }
  };

  function validateOne(key){
    const {el, wrap, test} = fields[key];
    const ok = test(el.value || '');
    wrap.classList.toggle('invalid', !ok);
    // A11y: esponi stato
    el.setAttribute('aria-invalid', String(!ok));
    return ok;
  }
  function validateAll(){
    const ok = Object.keys(fields).every(validateOne);
    btn.disabled = !ok;
    return ok;
  }

  Object.values(fields).forEach(({el}) => {
    el.addEventListener('input', validateAll);
    el.addEventListener('blur', e => validateOne(e.target.id));
  });
  validateAll();

  // Prepara la mail automatica e blocca invio se invalid
  form.addEventListener('submit', function (e) {
    if (!validateAll()) { e.preventDefault(); return; }
    const name = (fields.fullName.el.value || '').trim();
    const msg  = (fields.message.el.value || '').trim();

    const auto = `Ciao Gabriele,
Ti contatto per avere informazioni sul tuo servizio.

${msg}

${name}`;
    document.getElementById('message_to_owner').value = auto;

    btn.disabled = true;
    btn.textContent = 'Sending…';
  });

  // feedback opzionale se torni con ?sent=1
  const successMsg = document.getElementById('successMsg');
  if (new URLSearchParams(location.search).get('sent') === '1') {
    successMsg.style.display = 'block';
  }
  </script>
</body>
