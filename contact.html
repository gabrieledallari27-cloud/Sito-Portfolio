<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>Contact — Gabriele Dallari | 3D Generalist & Environment Artist</title>
<meta name="description" content="Contatta Gabriele Dallari per collaborazioni, commissioni o domande su 3D, Environment Art e Unreal Engine.">
<link rel="canonical" href="https://gabrieledallari.art/contact.html">

<!-- Favicons -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<!-- PWA -->
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0b0c10" />

<!-- Social -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Gabriele Dallari">
<meta property="og:title" content="Contact — Gabriele Dallari | 3D Generalist & Environment Artist">
<meta property="og:description" content="Scrivimi per collaborazioni, commissioni o informazioni. Risponderò al più presto.">
<meta property="og:url" content="https://gabrieledallari.art/contact.html">
<meta property="og:image" content="https://gabrieledallari.art/images/og/home.jpg">
<meta name="twitter:card" content="summary_large_image">

<!-- Fonts & Navbar -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/navbar.css" />

<style>
  :root{
    --bg:#0b0c10; --ink:#e9eaef; --muted:#b9b9c4;
    --line:#9ee7ff; --accent:#9ee7ff; --border:rgba(255,255,255,.12);
    --card-w:min(1100px,94vw); --led-thickness:3px; --danger:#ff6b6b;
    --nav-pt:80px;
  }
  @media (orientation:portrait){ :root{ --nav-pt:132px; } }

  *{ box-sizing:border-box }
  html,body{ height:100% }
  body{
    margin:0; color:var(--ink);
    background:
      linear-gradient(180deg, rgba(10,12,16,.78), rgba(10,12,16,.62)),
      url("images/contact/bg.webp") center/cover fixed no-repeat,
      #07070a;
    font-family:"Montserrat",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100svh; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    padding-top:var(--nav-h,var(--nav-pt));
  }
  main{ flex:1 0 auto; }

  .vfx-grain{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:url("images/vfx/film_grain_512.png");
    background-size:140px 140px; background-repeat:repeat;
    mix-blend-mode:soft-light; opacity:.14;
  }

  .wrap{ padding:clamp(20px,5vw,60px) 20px; display:flex; justify-content:center; }
  .contact-card{
    width:var(--card-w);
    background:transparent;
    border:var(--led-thickness) solid rgba(255,255,255,.95);
    border-radius:20px;
    box-shadow:0 0 38px rgba(158,231,255,.45),
               0 0 0 1px rgba(255,255,255,.35) inset,
               inset 0 0 12px rgba(255,255,255,.08);
    padding:clamp(18px,4vw,40px);
  }

  .grid{ display:grid; grid-template-columns:1fr 1.1fr; gap:clamp(18px,4vw,40px); }
  @media (max-width:900px){ .grid{ grid-template-columns:1fr; } }

  .left-col{ display:flex; align-items:center; }
  .contact-title{
    margin:0; width:100%;
    font-family:"Bebas Neue",sans-serif; font-weight:400;
    font-size:clamp(64px,12vw,220px); line-height:.9;
    text-shadow:0 0 3px rgba(0,0,0,.4);
  }

  form{ width:100%; }
  .row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:700px){ .row{ grid-template-columns:1fr; } }
  label{ display:block; font-size:.85rem; color:var(--muted); margin:12px 0 6px; }
  input,textarea{
    width:100%; color:var(--ink); background:transparent; border:none; outline:none;
    border-bottom:2px solid rgba(255,255,255,.22);
    padding:10px 4px 12px;
    font:400 1rem/1.4 "Montserrat",sans-serif;
    transition:border-color .2s, box-shadow .2s;
  }
  input:focus,textarea:focus{ border-bottom-color:var(--line); box-shadow:0 6px 20px -8px rgba(158,231,255,.35); }
  textarea{ min-height:140px; resize:vertical; }

  .field.invalid input, .field.invalid textarea{ border-bottom-color:var(--danger); }
  .error{ color:var(--danger); font-size:.82rem; margin-top:6px; display:none; }
  .field.invalid .error{ display:block; }

  .actions{ display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; align-items:center; }
  .btn{
    appearance:none; border:1px solid var(--border); cursor:pointer;
    color:var(--ink); background:rgba(18,20,26,.92);
    padding:12px 18px; border-radius:999px; font-weight:700; letter-spacing:.02em;
    transition:transform .15s, background .2s, color .2s, box-shadow .2s, filter .2s;
  }
  .btn:hover, .btn:focus-visible{
    background:var(--accent); color:#0b0c10; transform:translateY(-1px) scale(1.03);
    box-shadow:0 0 26px rgba(158,231,255,.45), inset 0 0 10px rgba(255,255,255,.18);
  }
  .btn[disabled]{ opacity:.6; cursor:not-allowed; }

  .note{ color:var(--muted); font-size:.9rem; }
  .recaptcha{ margin-top:14px; }

  /* ===== FOOTER come nelle altre pagine (con label hover + copyright) ===== */
  .site-footer{
    flex-shrink:0;
    border-top:1px solid rgba(255,255,255,.12);
    background: linear-gradient(180deg, rgba(10,12,16,.35), rgba(10,12,16,.12));
    backdrop-filter: blur(4px);
  }

  .footer-inner{
    max-width:980px;
    margin:0 auto;
    padding:14px 16px 34px; /* spazio extra per label */
    display:flex;
    justify-content:center;
  }

  .socials{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px; /* distanza uguale tra icone */
  }

  .social-item{
    width:44px;
    position:relative;
    display:flex;
    justify-content:center;
  }

  .social-item > a{
    width:44px; height:44px;
    display:grid; place-items:center;
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    color:#e9eaef;
    background:rgba(18,20,26,.70);
    box-shadow:0 8px 22px rgba(0,0,0,.35);
    text-decoration:none;
    transition: transform .15s ease, background .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .social-item > a:hover,
  .social-item > a:focus-visible{
    background:#9ee7ff; color:#0b0c10; border-color: rgba(158,231,255,.6);
    box-shadow: 0 0 22px rgba(158,231,255,.35), inset 0 0 10px rgba(255,255,255,.18);
    transform: translateY(-1px) scale(1.06);
    outline:none;
  }
  .social-item svg{ width:22px; height:22px; stroke-width:1.8; }
  .social-item svg *{ vector-effect:non-scaling-stroke; }

  .social-label{
    position:absolute;
    top:calc(44px + 8px);
    left:50%;
    transform:translateX(-50%) translateY(-4px);
    font-size:12px;
    letter-spacing:.04em;
    line-height:1;
    opacity:0;
    transition: opacity .15s ease, transform .15s ease;
    pointer-events:none;
    user-select:none;
    white-space:nowrap;
  }
  .social-item:hover .social-label,
  .social-item:focus-within .social-label{
    opacity:1;
    transform:translateX(-50%) translateY(0);
    color: var(--accent);
  }

  .footer-bottom{
    max-width:100%;
    padding:8px 16px 18px;
    font-size:13px;
    line-height:1.4;
    color:rgba(233,233,239,.72);
    text-align:center;
  }
</style>
</head>
<body>

  <!-- Navbar -->
  <div data-include="partials/navbar.html"></div>

  <div class="vfx-grain" aria-hidden="true"></div>

  <main class="wrap">
    <section class="contact-card" aria-label="Contact form">
      <div class="grid">
        <div class="left-col">
          <h1 class="contact-title">LET’S<br>GET IN<br>TOUCH</h1>
        </div>

        <!-- Netlify form statico -->
        <form name="contact" method="POST"
              data-netlify="true" netlify-honeypot="bot-field"
              action="/contact-success.html" id="contactForm" novalidate>

          <!-- hidden necessari -->
          <input type="hidden" name="form-name" value="contact">
          <input type="text" name="bot-field" style="display:none" aria-hidden="true">
          <input type="hidden" name="subject" value="New portfolio contact">

          <div class="row">
            <div class="field" id="fName">
              <label for="fullName">Full name *</label>
              <input id="fullName" name="fullName" type="text" required aria-required="true" autocomplete="name">
              <div class="error">Please enter your name and surname.</div>
            </div>
            <div class="field" id="fEmail">
              <label for="email">Email *</label>
              <input id="email" name="email" type="email" required aria-required="true" autocomplete="email" inputmode="email">
              <div class="error">Please enter a valid email address.</div>
            </div>
          </div>

          <div class="field" id="fMessage">
            <label for="message">Message *</label>
            <textarea id="message" name="message" required aria-required="true"></textarea>
            <div class="error">Please write at least 20 characters.</div>
          </div>

          <!-- reCAPTCHA di Netlify -->
          <div class="recaptcha" data-netlify-recaptcha="true"></div>
          <noscript><p class="note">Please enable JavaScript to submit the form.</p></noscript>

          <div class="actions">
            <button class="btn" type="submit" id="submitBtn" disabled>Send</button>
            <span class="note">You’ll get a confirmation on this page.</span>
          </div>
        </form>
      </div>
    </section>
  </main>

  <!-- ===== Footer INLINE (icone + label hover + copyright) ===== -->
  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner">
      <nav class="socials" aria-label="Social links">

        <div class="social-item">
          <a href="mailto:gabrieledallari.art@gmail.com" aria-label="Email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2" ry="2"></rect>
              <polyline points="3,7 12,13 21,7"></polyline>
            </svg>
          </a>
          <span class="social-label" aria-hidden="true">Email</span>
        </div>

        <div class="social-item">
          <a href="https://www.linkedin.com/in/gabriele-dallari" target="_blank" rel="noopener" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <rect x="2" y="9" width="4" height="12"></rect>
              <circle cx="4" cy="4" r="2"></circle>
              <path d="M10 9h4v2m0 0a4 4 0 0 1 4 4v6h-4v-6a2 2 0 0 0-4 0v6h-4V9h4"></path>
            </svg>
          </a>
          <span class="social-label" aria-hidden="true">LinkedIn</span>
        </div>

        <div class="social-item">
          <a href="https://www.instagram.com/gabbodallari" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <circle cx="12" cy="12" r="4.2"></circle>
              <circle cx="17.5" cy="6.5" r="1"></circle>
            </svg>
          </a>
          <span class="social-label" aria-hidden="true">Instagram</span>
        </div>

      </nav>
    </div>

    <div class="footer-bottom">
      © Gabriele Dallari 2026 – All Rights Reserved.
    </div>
  </footer>

  <!-- Se vuoi puoi lasciare i partial per navbar -->
  <script src="/js/partials.js?v=v5" defer></script>
  <script>
    // Padding dinamico sotto la navbar fissa
    (function(){
      const root = document.documentElement;
      function setNavHeight(){
        const nb = document.querySelector('.navbar');
        if(!nb) return;
        const h = Math.ceil(nb.getBoundingClientRect().height);
        root.style.setProperty('--nav-h', h + 'px');
        document.body.style.paddingTop = h + 'px';
      }
      const mo = new MutationObserver(() => {
        const nb = document.querySelector('.navbar');
        if(nb){
          setNavHeight();
          const ro = new ResizeObserver(setNavHeight);
          ro.observe(nb);
        }
      });
      mo.observe(document.body, {childList:true, subtree:true});
      window.addEventListener('load', setNavHeight);
      window.addEventListener('resize', setNavHeight);
      window.addEventListener('orientationchange', setNavHeight);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(setNavHeight);
      setTimeout(setNavHeight, 300); setTimeout(setNavHeight, 1000);
    })();

    // Abilita/disabilita il bottone in base a una semplice validazione lato client
    const btn = document.getElementById('submitBtn');
    const fields = {
      fullName: document.getElementById('fullName'),
      email: document.getElementById('email'),
      message: document.getElementById('message')
    };
    function valid(){
      const okName = fields.fullName.value.trim().split(/\s+/).length >= 2;
      const okMail = /^\S+@\S+\.\S+$/.test(fields.email.value.trim());
      const okMsg  = fields.message.value.trim().length >= 20;
      document.getElementById('fName').classList.toggle('invalid', !okName);
      document.getElementById('fEmail').classList.toggle('invalid', !okMail);
      document.getElementById('fMessage').classList.toggle('invalid', !okMsg);
      btn.disabled = !(okName && okMail && okMsg);
    }
    Object.values(fields).forEach(el => el.addEventListener('input', valid));
    valid();
  </script>
</body>
</html>
